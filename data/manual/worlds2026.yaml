# Worlds 2026 structure. Source: Liquipedia World_Championship/2026 (fetched 2026-10-11),
# Play-In draw per Sheep Esports. Leaguepedia is the intended source once LP creds are in .env.
# `oracle` = teamname as it appears in Oracle's Elixir (resolved by scripts/check_config.py).
name: Worlds 2026
patch: "26.20"         # Riot naming; Oracle's Elixir labels it 16.20
oracle_patch: "16.20"
league: WLDs

teams:
  # code: {name, region, seed, players: [top, jng, mid, bot, sup], subs: [[role, name], ...]}
  # subs: non-starters who may play, listed so the Elo tables rate them before they do (the sims only field them once they have).
  GEN:  {name: Gen.G,               region: LCK,   seed: 1, players: [Kiin, Canyon, Chovy, Ruler, Duro]}
  HLE:  {name: Hanwha Life Esports, region: LCK,   seed: 2, players: [Zeus, Kanavi, Zeka, Gumayusi, Delight]}
  T1:   {name: T1,                  region: LCK,   seed: 3, players: [Doran, Oner, Faker, Peyz, Keria]}
  DK:   {name: Dplus Kia,           region: LCK,   seed: 4, players: [Siwoo, Lucid, ShowMaker, Smash, Career]}
  AL:   {name: Anyone's Legend,     region: LPL,   seed: 1, players: [Breathe, Tarzan, Shanks, Hope, Kael]}
  BLG:  {name: Bilibili Gaming,     region: LPL,   seed: 2, players: [Bin, Xun, Knight, Viper, "ON"]}
  TES:  {name: Top Esports,         region: LPL,   seed: 3, players: ["369", Tian, Creme, JackeyLove, Zhuo], subs: [[top, ZUIAN]]}  # ZUIAN: visa issues (Oct 6)
  IG:   {name: Invictus Gaming,     region: LPL,   seed: 4, players: [TheShy, Wei, Rookie, JiaQi, Meiko]}
  TL:   {name: Team Liquid,         region: LCS,   seed: 1, players: [Morgan, Josedeodo, Quid, Yeon, CoreJJ]}
  LYON: {name: LYON,                region: LCS,   seed: 2, players: [Dhokla, Inspired, Saint, Berserker, Isles]}
  C9:   {name: Cloud9,              region: LCS,   seed: 3, players: [Thanatos, Blaber, Loki, Tactical, Vulcan]}
  G2:   {name: G2 Esports,          region: LEC,   seed: 1, players: [BrokenBlade, SkewMond, Caps, Hans Sama, Labrov]}
  MKOI: {name: Movistar KOI,        region: LEC,   seed: 2, players: [Myrwn, Elyoya, Jojopyun, Supa, Alvaro]}
  KC:   {name: Karmine Corp,        region: LEC,   seed: 3, players: [Canna, Yike, kyeahoo, Caliste, Busio]}
  TSW:  {name: Team Secret Whales,  region: LCP,   seed: 1, players: [Pun, Hizto, Dire, Eddie, Bie]}
  CFO:  {name: CTBC Flying Oyster,  region: LCP,   seed: 2, players: [Rest, Shad0w, Pout, Doggo, Kino]}
  MVK:  {name: MVK Esports,         region: LCP,   seed: 3, players: [Kratos, Gury, Chika, Harky, SiuLoong]}
  LOS:  {name: LØS,                 region: CBLOL, seed: 1, players: [Zest, Curse, Feisty, Duduhh, Ackerman]}
  FUR:  {name: FURIA,               region: CBLOL, seed: 2, players: [Guigo, Tatu, Tutsz, Ayu, JoJo]}

play_in:
  format: double_elim_4
  best_of: 5
  fearless: true
  # Upper semis (drawn 2026-10-10). Game-1 side choice by draw order -> coin flip.
  upper_semis: [[C9, KC], [FUR, MVK]]
  # Qualifying match: upper-bracket-final winner gets dual selection.

swiss:
  rounds: 5
  win_target: 3
  loss_target: 3
  bo1_fearless: false
  bo3_fearless: true    # advancement/elimination matches (2-x or x-2) are Bo3
  # Round 1 draw: pool1 vs pool4, pool2 vs pool3, no same-region R1, no rematches overall.
  pools:
    1: [GEN, AL, TL, G2]
    2: [TSW, LOS, HLE, BLG]
    3: [LYON, MKOI, T1, TES]
    4: [CFO, DK, IG, PLAYIN_WINNER]
  # The real Round 1 draw (made 2026-10-18 in LA; KC took the Play-In slot), in
  # Liquipedia's listed order. Once set, the pools above are no longer drawn from.
  round1:
    - [GEN, IG]
    - [TL, CFO]
    - [AL, PLAYIN_WINNER]
    - [G2, DK]
    - [HLE, TES]
    - [LOS, T1]
    - [TSW, LYON]
    - [BLG, MKOI]
  # Announced pairings for later rounds, as {round: [[A, B], ...]} (all of the round's
  # series). Used only when a run's records lead to exactly that round (R1 is played, so
  # real data always does); otherwise the round is drawn. Add a round once Riot posts it.
  draws:
    2:
      - [TES, AL]
      - [CFO, MKOI]
      - [G2, LOS]
      - [LYON, KC]
      - [IG, TSW]
      - [HLE, GEN]
      - [DK, T1]
      - [TL, BLG]
  # Game-1 side: higher regional seed; tie -> draw order (coin flip).

knockouts:
  best_of: 5
  fearless: true
  # QF draw: 3-0 teams on opposite halves, each vs a 3-2 team; the rest drawn among themselves.
  # QF side: better Swiss record; SF/F: coin flip.
  # Real quarterfinal draw once known, in bracket order (QF1, QF2 -> SF1; QF3, QF4 -> SF2),
  # e.g. [[GEN, AL], [DK, G2], [HLE, KC], [T1, BLG]]. Empty = use the predicted placeholder draw.
  draw: []
  # Pick'Em points per correct pick (Play-In used 5 per match, 10 for the final).
  pickem_points: {QF: 5, SF: 5, Final: 10}

# The calendar the simulation walks forward on: draftpredict reads a day's
# earlier results through live-quality (win/loss) Elo updates and gets the full
# Oracle update at the next day's open, so which games share a day matters.
# Dates are Riot's (Play-In Oct 15-18, Swiss Oct 23-26 + 28-31, QF Nov 3-6,
# SF Nov 7-8, Final Nov 14); which series fall on which day is not published,
# so the splits below follow Worlds 2025's (from Oracle's Elixir dates):
# one Swiss round per day for R1/R2, R3's Bo3s then its Bo1s, the Bo3 rounds
# spread across the remaining days, one knockout series per day.
# Entries in play order: `round` is the start of the simulator's round label,
# `n` how many of that round's series (default: all remaining).
schedule:
  - {date: 2026-10-15, stage: play_in, round: UB semi, n: 2}
  - {date: 2026-10-16, stage: play_in, round: UB final}
  - {date: 2026-10-16, stage: play_in, round: LB semi}
  - {date: 2026-10-17, stage: play_in, round: LB final}
  - {date: 2026-10-18, stage: play_in, round: Qualifier}
  - {date: 2026-10-23, stage: swiss, round: R1}
  - {date: 2026-10-24, stage: swiss, round: R2}
  - {date: 2026-10-25, stage: swiss, round: R3 2-0}
  - {date: 2026-10-25, stage: swiss, round: R3 0-2}
  - {date: 2026-10-26, stage: swiss, round: R3 1-1}
  - {date: 2026-10-28, stage: swiss, round: R4, n: 2}
  - {date: 2026-10-29, stage: swiss, round: R4, n: 2}
  - {date: 2026-10-30, stage: swiss, round: R4, n: 2}
  - {date: 2026-10-31, stage: swiss, round: R5}
  - {date: 2026-11-03, stage: knockout, round: QF, n: 1}
  - {date: 2026-11-04, stage: knockout, round: QF, n: 1}
  - {date: 2026-11-05, stage: knockout, round: QF, n: 1}
  - {date: 2026-11-06, stage: knockout, round: QF, n: 1}
  - {date: 2026-11-07, stage: knockout, round: SF, n: 1}
  - {date: 2026-11-08, stage: knockout, round: SF, n: 1}
  - {date: 2026-11-14, stage: knockout, round: Final}
