# Pick'Em question stand-ins for the entity-specific 2026 questions (Peyz and the
# Faker 700-kill milestone don't apply to 2025). HLE vs T1 and LCS are unchanged.
pickem:
  duel: [Viper, Gumayusi]
  milestone: {player: Faker, kills: 84, text: "Will Faker reach 84 Worlds Kills this year?"}

play_in:
  format: single
  teams: [T1, IG]
  best_of: 5
  fearless: true

swiss:
  rounds: 5
  win_target: 3
  loss_target: 3
  bo1_fearless: false
  bo3_fearless: true
  round1:
    - [TSW, VKS]
    - [CFO, FNC]
    - [KT, MKOI]
    - [BLG, 100T]
    - [FLY, PLAYIN_WINNER]
    - [HLE, AL]
    - [G2, TES]
    - [GEN, PSG]

knockouts:
  best_of: 5
  fearless: true
  draw: [[GEN, HLE], [KT, CFO], [TES, G2], [AL, T1]]  # the real quarterfinal draw, bracket order
  pickem_points: {QF: 5, SF: 5, Final: 10}

