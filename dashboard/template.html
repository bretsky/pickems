<title>Worlds 2026 Pick'Em Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: broadcast-style header, tab strip, then dense scan-first panels in a wrapping grid. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #141822; --muted: #5d6676; --line: #dde2ea;
  --accent: #0b7285; --accent-soft: #d6eef2; --gold: #a77b1c; --gold-soft: #f4ead2;
  --good: #2b8a3e; --bad: #c92a2a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --surface: #171c25; --ink: #e7eaf0; --muted: #98a2b3; --line: #2a313d;
  --accent: #3bc9db; --accent-soft: #123a42; --gold: #e0b45a; --gold-soft: #3a2f17;
  --good: #69db7c; --bad: #ff8787; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171c25; --ink: #e7eaf0; --muted: #98a2b3; --line: #2a313d;
  --accent: #3bc9db; --accent-soft: #123a42; --gold: #e0b45a; --gold-soft: #3a2f17;
  --good: #69db7c; --bad: #ff8787; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 12px }
h1 { font: 700 2.4rem/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase }
h1 span { color: var(--gold) }
h2 { font: 600 1.35rem/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; text-wrap: balance }
h3 { font: 600 1.05rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; color: var(--muted) }
.meta { font: 12px/1.5 var(--mono); color: var(--muted); text-align: right; margin-left: auto }
.meta b { color: var(--ink); font-weight: 500 }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin: 16px 0 }
nav button, .seg button { font: 600 1rem var(--display); text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 6px 14px; cursor: pointer; border-radius: 3px }
nav button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; min-width: 0 }
.panel.wide { grid-column: 1 / -1 }
.note { color: var(--muted); font-size: 13px; max-width: 75ch; margin: 0 0 12px }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th { font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap }
th:first-child, td:first-child { text-align: left }
td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--mono); font-size: 12.5px }
td.name { font-family: var(--body); font-weight: 500; font-size: 13.5px }
tr:last-child td { border-bottom: 0 }
.cell { position: relative; z-index: 0 }
.cell i { position: absolute; inset: 3px auto 3px 0; background: var(--accent-soft); z-index: -1; border-radius: 2px }
.cell.gold i { background: var(--gold-soft) }
.pill { display: inline-block; font: 500 11px var(--mono); padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px }
.region { font: 500 11px var(--mono); color: var(--muted); margin-left: 6px }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 14px }
.bucket { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0 }
.bucket h3 { margin-bottom: 6px }
.bucket ol { margin: 0; padding-left: 20px; font-weight: 600 }
.bucket li span { font: 400 12px var(--mono); color: var(--muted); margin-left: 6px }
.big { font: 700 2rem/1 var(--display); color: var(--gold) }
.seg { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px }
.leader td.p { width: 38% }
.dist { display: flex; align-items: end; gap: 2px; height: 70px; margin: 6px 0 2px }
.dist div { flex: 1; background: var(--accent); opacity: .75; min-height: 1px; border-radius: 1px 1px 0 0 }
.distlab { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted) }
.stat { display: flex; justify-content: space-between; gap: 8px; font: 12.5px var(--mono) }
.stat b { font-weight: 500 }
.qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px }
.qn { font: 600 .9rem var(--display); color: var(--muted); letter-spacing: .08em }
.q { margin: 0 0 8px; font-weight: 500; text-wrap: balance }
.ans { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap }
.ans .big { font-size: 1.6rem }
.ansp { font: 500 14px var(--mono); color: var(--accent) }
.up { color: var(--good) } .down { color: var(--bad) }
.modebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: -4px 0 16px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px }
.modebar .seg { margin: 0 }
.modebar .runinfo { font: 12.5px var(--mono); color: var(--muted) }
.modebar .runinfo b { color: var(--ink); font-weight: 500 }
.tool { font: 600 .95rem var(--display); text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 5px 12px; cursor: pointer; border-radius: 3px }
.tool:hover { border-color: var(--accent) }
.single-flag { display: inline-block; font: 600 .8rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 0 6px; margin-left: 8px; vertical-align: middle }
/* Brackets: columns of match cards, vertically centered so later rounds sit between their feeders. */
.bracket { display: grid; gap: 10px 28px; align-items: center; min-width: 640px }
.bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; height: 100% }
.bhead { font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px }
.match { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); overflow: hidden; position: relative; min-width: 0 }
.match .slot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 9px; font-size: 13px; border-left: 3px solid transparent }
.match .slot + .slot { border-top: 1px solid var(--line) }
.match .slot.win { font-weight: 600; border-left-color: var(--accent); background: var(--accent-soft) }
.match .slot.win.gold { border-left-color: var(--gold); background: var(--gold-soft) }
.match .slot span:last-child { font: 12px var(--mono); color: var(--muted) }
.match .slot.win span:last-child { color: var(--ink) }
.match .mlabel { font: 600 .72rem var(--display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 3px 9px 0 }
.pi-grid { grid-template-columns: repeat(4, minmax(150px, 1fr)); grid-template-areas: "ubs ubf . q" "ubs2 lbs lbf q" }
.ko-grid { grid-template-columns: repeat(3, minmax(170px, 1fr)) }
.bwrap { display: flex; flex-direction: column; height: 100% }
.bwrap .bcol { flex: 1 }
.ko-grid { align-items: stretch }
.ko-grid .bcol { min-height: 400px }
.swiss-grid { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 14px; min-width: 780px }
.swiss-grid .bcol { justify-content: flex-start; gap: 8px }
.recgrid { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 10px; min-width: 700px }
.recgrid .bucket { padding: 8px 10px }
.recgrid .bucket div { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0 }
.recgrid .bucket div span { font: 12px var(--mono); color: var(--muted) }
.outcome { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font: 12.5px var(--mono); color: var(--muted); margin-top: 6px }
.match-ok { color: var(--good) } .match-no { color: var(--bad) }
/* Single-run series detail: clickable cards open a dialog with each game's draft and box score. */
.match[data-g] { cursor: pointer }
.match[data-g]:hover, .match[data-g]:focus-visible { border-color: var(--accent); outline: none }
.match .more { font: 500 11px var(--mono); color: var(--accent); padding: 2px 9px 4px; text-align: right }
dialog.series { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); padding: 0 }
dialog.series::backdrop { background: rgb(0 0 0 / .45) }
.dhead { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line) }
.dhead h2 { margin: 0 }
.dbody { padding: 12px 16px 18px }
.game { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-top: 12px }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px }
.ghead h3 { margin: 0; font: 600 1.1rem var(--display); text-transform: uppercase; letter-spacing: .04em }
.ghead span { font: 12.5px var(--mono); color: var(--muted) }
.ghead b { color: var(--ink); font-weight: 500 }
.draft { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px }
.draft span { font: 500 11.5px var(--mono); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line) }
.draft span.B { border-color: #4c8bf5; color: #4c8bf5 }
.draft span.R { border-color: #e8590c; color: #e8590c }
.draft span.ban { text-decoration: line-through; opacity: .65 }
.draft span.p.B { background: rgb(76 139 245 / .12) } .draft span.p.R { background: rgb(232 89 12 / .12) }
.draft i { font-style: normal; color: var(--muted); font: 11px var(--mono); align-self: center; margin: 0 2px }
.box { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 10px }
.box > div { overflow-x: auto }
.box th.side { text-align: left }
.box .B th.side { color: #4c8bf5 } .box .R th.side { color: #e8590c }
.wtag { font: 600 .75rem var(--display); letter-spacing: .08em; color: var(--good); margin-left: 6px }
@media (prefers-reduced-motion: no-preference) { .cell i { transition: width .3s ease } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Worlds 2026 <span>Pick'Em Lab</span></h1>
      <div class="note" style="margin:6px 0 0">Monte Carlo of every game: procedural drafts on patch 26.20, draftpredict win odds, simulated box scores.</div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<script id="report" type="application/json">__REPORT__</script>
<script>
const R = JSON.parse(document.getElementById('report').textContent);
const pct = (x, d = 1) => x == null || isNaN(x) ? '&ndash;' : (x * 100).toFixed(d) + '%';
const num = (x, d = 1) => x == null || isNaN(x) ? '&ndash;' : Number(x).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const teamName = c => (R.meta.teams[c] || {}).name || c;
const region = c => (R.meta.teams[c] || {}).region || '';
const bar = (x, max = 1, cls = '') => `<td class="cell ${cls}"><i style="width:${Math.max(0, Math.min(1, x / (max || 1))) * 100}%"></i>${pct(x)}</td>`;

const m = R.meta.model || {};
const lg = R.meta.latest_game;
document.getElementById('meta').innerHTML =
  `<b>${R.meta.sims.toLocaleString()}</b> simulated tournaments<br>` +
  `run ${esc(new Date(R.meta.run_at).toLocaleString())}<br>` +
  `draftpredict ${esc((m.commit || '').slice(0, 7))}${m.dirty ? ' (uncommitted edits)' : ''} &middot; params v${esc(m.params_version ?? '?')}` +
  (R.meta.worlds_weight ? `<br>Worlds-weighted training (w = ${esc(R.meta.worlds_weight)})` : '') +
  (R.meta.data_through ? `<br>training data through ${esc(new Date(R.meta.data_through).toLocaleDateString())}` : '') +
  (lg ? `<br>latest Worlds-team game in data: ${esc(new Date(lg.date).toLocaleDateString())} &middot; ${esc(lg.league)} ` +
        `<b>${esc(lg.blue)}</b> vs <b>${esc(lg.red)}</b> (game ${esc(lg.game)}, ${esc(lg.blue_win ? lg.blue : lg.red)} won)` : '');

const TABS = R.pickems
  ? { pickems: 'Your Pick\'Ems', bracket: 'Bracket', odds: 'Title odds', crystal: 'Stat leaders', meta: '26.20 meta' }
  : { odds: 'Title odds', swiss: 'Swiss Pick\'Em', crystal: 'Stat leaders', meta: '26.20 meta' };
let tab = Object.keys(TABS)[0], scope = 'all';
let mode = 'likely', runIdx = 0;
const RUNS = R.runs || [];
const single = () => mode === 'single' && RUNS.length > 0;
const RUN = () => RUNS[runIdx];
try { const t = localStorage.getItem('pk_tab'); if (t in TABS) tab = t; scope = localStorage.getItem('pk_scope') || scope } catch (e) {}
if (location.hash.slice(1) in TABS) tab = location.hash.slice(1);
try { mode = localStorage.getItem('pk_mode') || mode } catch (e) {}
if (RUNS.length) runIdx = Math.floor(Math.random() * RUNS.length);

function modeBar() {
  if (!RUNS.length || !(tab === 'pickems' || tab === 'bracket')) return '';
  const run = RUN();
  return `<div class="modebar"><div class="seg" role="group" aria-label="Mode">
    <button aria-pressed="${mode === 'likely'}" data-mode="likely">Most likely</button>
    <button aria-pressed="${mode === 'single'}" data-mode="single">Single run</button></div>
    ${mode === 'single' ? `<button class="tool" data-run="prev" aria-label="Previous run">&larr;</button>
      <button class="tool" data-run="roll">Roll random run</button>
      <button class="tool" data-run="next" aria-label="Next run">&rarr;</button>
      <span class="runinfo">Simulation <b>#${run.id + 1}</b> of ${R.meta.sims.toLocaleString()} &middot; champion <b>${esc(teamName(run.champion))}</b></span>`
      : `<span class="runinfo">Picks that maximize expected points across all ${R.meta.sims.toLocaleString()} simulations.</span>`}</div>`;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = Object.entries(TABS).map(([k, v]) =>
    `<button role="tab" id="tab-${k}" aria-selected="${k === tab}" data-tab="${k}">${v}</button>`).join('');
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem('pk_tab', tab) } catch (e) {}
  render();
});

// A match card. rows: [{team, label, win, gold}]
// In single-run mode, a series with a game log is clickable (data-g indexes OPEN).
let OPEN = [];
function matchCard(title, rows) {
  const m = rows.series, g = m && m.games ? OPEN.push(m) - 1 : -1;
  return `<div class="match"${g >= 0 ? ` data-g="${g}" tabindex="0" role="button" aria-label="Show games: ${esc(teamName(m.a))} vs ${esc(teamName(m.b))}"` : ''}>${title ? `<div class="mlabel">${esc(title)}</div>` : ''}${rows.map(r =>
    `<div class="slot ${r.win ? 'win' : ''} ${r.gold ? 'gold' : ''}"><span>${esc(r.team ? teamName(r.team) : 'TBD')}</span><span>${r.label ?? ''}</span></div>`).join('')}${g >= 0 ? '<div class="more">games &amp; drafts &rsaquo;</div>' : ''}</div>`;
}
const seriesRows = (m, gold) => Object.assign([
  { team: m.a, label: m.wa, win: m.winner === m.a, gold }, { team: m.b, label: m.wb, win: m.winner === m.b, gold }], { series: m });

const CH = i => (R.champs || [])[i] ?? '?';
const ROLE_NAMES = ['Top', 'Jungle', 'Mid', 'Bot', 'Support'];
const player = (t, i) => ((R.meta.teams[t] || {}).players || [])[i] || ROLE_NAMES[i];
function gameDetail(g, label) {
  const winner = g.blue_win ? g.blue : g.red;
  // Draft in pick order; a divider marks each ban/pick phase change.
  let prev = null;
  const draft = g.draft.map(x => [x & 2 ? 'b' : 'p', x & 1 ? 'R' : 'B', CH(x >> 2)]).map(([a, s, c]) => { const sep = prev && prev !== a ? '<i>|</i>' : ''; prev = a;
    return `${sep}<span class="${a === 'b' ? 'ban' : 'p'} ${s}" title="${s === 'B' ? 'Blue' : 'Red'} ${a === 'b' ? 'ban' : 'pick'}">${esc(c)}</span>` }).join('');
  const side = (t, s, champs, lines, won) => `<div><table class="${s}"><thead><tr><th class="side">${esc(teamName(t))} &middot; ${s === 'B' ? 'Blue' : 'Red'}${won ? '<span class="wtag">WIN</span>' : ''}</th><th>Champion</th><th>K/D/A</th><th>CS</th><th>Dmg</th></tr></thead><tbody>
    ${champs.map((c, i) => { const [k, d, a, cs, dmg] = lines[i];
      return `<tr><td class="name">${esc(player(t, i))}<span class="region">${ROLE_NAMES[i]}</span></td><td class="name">${esc(CH(c))}</td><td>${k}/${d}/${a}</td><td>${cs}</td><td>${(dmg / 1000).toFixed(1)}k</td></tr>` }).join('')}</tbody></table></div>`;
  return `<div class="game"><div class="ghead"><h3>${label} ${g.g}</h3>
    <span>winner <b>${esc(teamName(winner))}</b></span><span><b>${num(g.len, 1)}</b> min</span>
    <span>kills <b>${g.bk}&ndash;${g.rk}</b></span><span>pre-game P(${esc(g.blue)} win) <b>${pct(g.p_blue, 0)}</b></span>
    <span>first pick <b>${esc(g.fp === 'B' ? g.blue : g.red)}</b></span></div>
    <div class="draft" aria-label="Draft order">${draft}</div>
    <div class="box">${side(g.blue, 'B', g.bc, g.bp, g.blue_win)}${side(g.red, 'R', g.rc, g.rp, !g.blue_win)}</div></div>`;
}
function openSeries(m) {
  let d = document.getElementById('series-dlg');
  if (!d) {
    d = document.createElement('dialog'); d.id = 'series-dlg'; d.className = 'series'; document.body.appendChild(d);
    d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close() });
  }
  d.innerHTML = `<div class="dhead"><h2>${esc(teamName(m.a))} ${m.wa}&ndash;${m.wb} ${esc(teamName(m.b))}</h2><button class="tool" data-close aria-label="Close">Close</button></div>
    <div class="dbody"><p class="note" style="margin:0">${esc(m.round)} &middot; simulation #${RUN().id + 1}. Draft reads left to right; struck-through names are bans, blue/orange is the side.</p>
    ${m.games.map(g => gameDetail(g, 'Game')).join('')}</div>`;
  d.showModal();
}
const pickRows = (a, b, pick, p, gold) => [
  { team: a, label: pick === a ? pct(p, 0) : '', win: pick === a, gold }, { team: b, label: pick === b ? pct(p, 0) : '', win: pick === b, gold }];

function playInBracket() {
  let M;
  if (single()) {
    const pi = RUN().play_in;  // order: UB semi x2, UB final, LB semi, LB final, Qualifier
    M = { ubs: seriesRows(pi[0]), ubs2: seriesRows(pi[1]), ubf: seriesRows(pi[2]), lbs: seriesRows(pi[3]), lbf: seriesRows(pi[4]), q: seriesRows(pi[5], true) };
  } else {
    const B = R.pickems.play_in_bracket, P = B.picks, pp = B.pick_prob;
    const semis = Object.keys(P).filter(k => k.startsWith('UB semi'));
    const pair = k => k.replace('UB semi ', '').split('-');
    const [a1, b1] = pair(semis[0]), [a2, b2] = pair(semis[1]);
    const w1 = P[semis[0]], w2 = P[semis[1]], l1 = w1 === a1 ? b1 : a1, l2 = w2 === a2 ? b2 : a2;
    const ubfL = P['UB final'] === w1 ? w2 : w1;
    M = { ubs: pickRows(a1, b1, w1, pp[semis[0]]), ubs2: pickRows(a2, b2, w2, pp[semis[1]]), ubf: pickRows(w1, w2, P['UB final'], pp['UB final']),
          lbs: pickRows(l1, l2, P['LB semi'], pp['LB semi']), lbf: pickRows(ubfL, P['LB semi'], P['LB final'], pp['LB final']),
          q: pickRows(P['UB final'], P['LB final'], P['Qualifier'], pp['Qualifier'], true) };
  }
  const cell = (area, title, rows) => `<div style="grid-area:${area}">${matchCard(title, rows)}</div>`;
  return `<div class="scroll"><div class="bracket pi-grid">
    ${cell('ubs', 'Upper semifinal', M.ubs)}${cell('ubs2', 'Upper semifinal', M.ubs2)}${cell('ubf', 'Upper final', M.ubf)}
    ${cell('lbs', 'Lower semifinal', M.lbs)}${cell('lbf', 'Lower final', M.lbf)}${cell('q', 'Qualifier \u00b7 10 pts', M.q)}
  </div></div>`;
}

function knockoutBracket() {
  let qf, sf, fin, note = '';
  if (single()) {
    const k = RUN().knockout;
    qf = k.filter(m => m.round === 'QF').map(m => seriesRows(m));
    sf = k.filter(m => m.round === 'SF').map(m => seriesRows(m));
    fin = k.filter(m => m.round === 'Final').map(m => seriesRows(m, true));
  } else {
    const K = R.knockout, B = K.bracket;
    if (!B) {
      qf = K.draw.map(([a, b]) => pickRows(a, b, null, 0)); sf = [pickRows(null, null), pickRows(null, null)]; fin = [pickRows(null, null)];
      note = 'Head-to-head odds not simulated yet: run scripts/h2h.py.';
    } else {
      const P = B.picks, pp = B.pick_prob;
      qf = K.draw.map(([a, b], i) => pickRows(a, b, P['QF' + (i + 1)], pp['QF' + (i + 1)]));
      sf = [pickRows(P.QF1, P.QF2, P.SF1, pp.SF1), pickRows(P.QF3, P.QF4, P.SF2, pp.SF2)];
      fin = [pickRows(P.SF1, P.SF2, P.Final, pp.Final, true)];
    }
  }
  const col = (head, list, title) => `<div class="bwrap"><div class="bhead">${head}</div><div class="bcol">${list.map(r => matchCard(title, r)).join('')}</div></div>`;
  return `<div class="scroll"><div class="bracket ko-grid">${col('Quarterfinals', qf)}${col('Semifinals', sf)}${col('Final', fin)}</div></div>${note ? `<p class="note">${note}</p>` : ''}`;
}

const RECORDS = ['3-0', '3-1', '3-2', '2-3', '1-3', '0-3'];
function swissBracket() {
  if (single()) {
    const sw = RUN().swiss, rounds = [1, 2, 3, 4, 5];
    const cols = rounds.map(n => {
      const ms = sw.filter(m => m.round.startsWith('R' + n + ' '));
      return `<div class="bcol"><div class="bhead">Round ${n}</div>${ms.map(m => matchCard(m.round.split(' ')[1] + (m.wa + m.wb > 1 ? ' \u00b7 Bo3' : ''), seriesRows(m))).join('')}</div>`;
    }).join('');
    const rec = RUN().swiss_record;
    return `<div class="scroll"><div class="swiss-grid">${cols}</div></div>
      <h3 style="margin-top:14px">Final records</h3><div class="scroll"><div class="recgrid">${RECORDS.map(r =>
      `<div class="bucket"><h3>${r}</h3>${Object.keys(rec).filter(t => rec[t] === r).map(t => `<div>${esc(teamName(t))}</div>`).join('')}</div>`).join('')}</div></div>`;
  }
  const recs = R.knockout.records, O = Object.fromEntries(R.outcomes.map(o => [o.team, o]));
  const key = r => 'swiss_' + r.replace('-', '_');
  return `<p class="note">Each team in its most likely final record, with every record holding its real number of teams (2 / 3 / 3 / 3 / 3 / 2). Percentages are that team's chance of that exact record.</p>
    <div class="scroll"><div class="recgrid">${RECORDS.map(r => `<div class="bucket"><h3>${r}</h3>${Object.keys(recs).filter(t => recs[t] === r)
      .map(t => `<div>${esc(teamName(t))}<span>${pct(O[t][key(r)] / (O[t].swiss || 1), 0)}</span></div>`).join('')}</div>`).join('')}</div></div>`;
}

function bracketView() {
  const tag = single() ? '<span class="single-flag">Single run</span>' : '';
  const K = R.knockout || {};
  return `<div class="grid">
    <section class="panel wide"><h2>Play-In${tag}</h2>${playInBracket()}</section>
    <section class="panel wide"><h2>Swiss stage${tag}</h2>${swissBracket()}</section>
    <section class="panel wide"><h2>Knockouts${tag}</h2>${!single() && !K.draw_is_real ? '<p class="note">Placeholder draw from the predicted Swiss results (3-0 teams face 3-2 teams on opposite halves). Set knockouts.draw in the config once the real draw happens.</p>' : ''}${knockoutBracket()}</section>
  </div>`;
}

function pickemsView() {
  const B = R.pickems.play_in_bracket, Q = R.pickems.crystal_ball;
  const order = Object.keys(B.picks);
  const tag = single() ? '<span class="single-flag">Single run</span>' : '';
  const bracket = `<section class="panel wide"><h2>Play-In bracket${tag}</h2>
  <p class="note">${single() ? 'What happened in this simulation, with series scores.' : `Best of all 64 consistent brackets. Expected <b>${num(B.expected_points, 1)}</b> of ${B.max_points} points (runner-up bracket ${num(B.runner_up.expected_points, 1)}).`}</p>
  ${playInBracket()}
  ${single() ? '' : `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Match</th><th>Pick</th><th>Pts</th><th>P(correct)</th></tr></thead><tbody>
  ${order.map(k => `<tr><td class="name">${esc(k)}</td><td class="name">${esc(teamName(B.picks[k]))}</td><td>${k === 'Qualifier' ? 10 : 5}</td>${bar(B.pick_prob[k], 1, k === 'Qualifier' ? 'gold' : '')}</tr>`).join('')}
  </tbody></table></div>`}</section>`;
  const K = R.knockout || {}, KB = K.bracket;
  const ko = `<section class="panel wide"><h2>Knockout bracket${tag}</h2>
  <p class="note">${single() ? 'This simulation\'s quarterfinals onward.' : (K.draw_is_real ? 'Real quarterfinal draw.' : '<b>Placeholder draw</b> built from the predicted Swiss results; replace with the real draw (knockouts.draw in the config) and rerun scripts/h2h.py.') +
    (KB ? ` Best of all 128 consistent brackets from ${K.h2h.series} simulated Bo5s per pair. Expected <b>${num(KB.expected_points, 1)}</b> of ${KB.max_points} points (QF ${KB.points.QF}, SF ${KB.points.SF}, Final ${KB.points.Final} per pick; Riot hasn't published these yet).` : '')}</p>
  ${knockoutBracket()}
  ${!single() && KB ? `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Match</th><th>Pick</th><th>P(correct)</th><th>Title odds (this draw)</th></tr></thead><tbody>
    ${Object.keys(KB.picks).map(k => `<tr><td class="name">${k}</td><td class="name">${esc(teamName(KB.picks[k]))}</td>${bar(KB.pick_prob[k], 1, k === 'Final' ? 'gold' : '')}<td>${k === 'Final' ? Object.entries(KB.champion_odds).slice(0, 4).map(([t, p]) => `${esc(t)} ${pct(p, 0)}`).join(' &middot; ') : ''}</td></tr>`).join('')}
  </tbody></table></div>` : ''}</section>`;
  const card = (x, i) => {
    if (single()) {
      const a = RUN().answers[i], same = a.answer === x.answer || a.answer.split(' / ').some(s => s === x.answer);
      return `<section class="panel"><div class="qhead"><span class="qn">Q${i + 1}</span><span class="pill">${x.pts} pts</span></div>
      <p class="q">${esc(x.question)}</p>
      <div class="ans"><span class="big">${esc(a.answer)}</span><span class="ansp">${esc(a.value)}</span></div>
      <div class="outcome">Most-likely pick: <b>${esc(x.answer)}</b> (${pct(x.p, 0)}) <span class="${same ? 'match-ok' : 'match-no'}">${same ? '&#10003; would score' : '&#10007; would miss'}</span></div></section>`;
    }
    const max = Math.max(...x.options.map(o => o.p));
    const det = x.detail && x.detail.length ? x.detail : null;
    const rows = (det || x.options).slice(0, 6).map(o => `<tr><td class="name">${esc(o.label)}</td>${bar(o.p, max)}${det ? `<td>${esc(o.value)}</td>` : ''}</tr>`).join('');
    return `<section class="panel"><div class="qhead"><span class="qn">Q${i + 1}</span><span class="pill">${x.pts} pts</span></div>
    <p class="q">${esc(x.question)}</p>
    <div class="ans"><span class="big">${esc(x.answer)}</span><span class="ansp">${pct(x.p, 0)}</span></div>
    <table><thead><tr><th>Option</th><th>Chance</th>${det ? '<th>Avg</th>' : ''}</tr></thead><tbody>${rows}</tbody></table>
    ${x.note ? `<p class="note" style="margin:8px 0 0">${esc(x.note)}</p>` : ''}</section>`;
  };
  let score = '';
  if (single()) {
    const hits = Q.filter((x, i) => { const a = RUN().answers[i].answer; return a === x.answer || a.split(' / ').includes(x.answer) });
    score = ` In this run the most-likely picks score <b>${hits.reduce((s, x) => s + x.pts, 0)}</b> of ${Q.reduce((s, x) => s + x.pts, 0)} points (${hits.length}/${Q.length}).`;
  }
  return `<div class="grid">${bracket}${swissPicksPanel()}${ko}${single() ? '' : swissOddsPanel()}</div><h2 style="margin-top:22px">Crystal Ball${tag}</h2>
  <p class="note">${single() ? 'Each card shows what actually happened in this one simulation.' + score : 'Each card shows the pick with the best chance of being right and how likely it is. Ties in the simulated leaderboards are split evenly.'}</p>
  <div class="grid">${Q.map(card).join('')}</div>`;
}

function oddsView() {
  const rows = R.outcomes;
  const maxC = Math.max(...rows.map(r => r.champion));
  return `<div class="grid"><section class="panel wide"><h2>Who lifts the Summoner's Cup</h2>
  <p class="note">Share of simulations in which each team reaches each round. Play-In teams need to win the Play-In first.</p>
  <div class="scroll"><table><thead><tr><th>Team</th><th>Champion</th><th>Final</th><th>Semis</th><th>Quarters</th><th>Reach Swiss</th><th>3-0</th><th>0-3</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td class="name">${esc(teamName(r.team))}<span class="region">${esc(r.team)} &middot; ${esc(region(r.team))}</span></td>
    ${bar(r.champion, maxC, 'gold')}${bar(r.final)}${bar(r.semis)}${bar(r.quarters)}<td>${pct(r.swiss, 0)}</td><td>${pct(r.swiss_3_0)}</td><td>${pct(r.swiss_0_3)}</td></tr>`).join('')}
  </tbody></table></div></section>
  <section class="panel"><h2>Play-In</h2><p class="note">Double elimination, all Bo5 fearless. Winner joins Swiss pool 4.</p>
  <table><thead><tr><th>Team</th><th>Wins Play-In</th></tr></thead><tbody>
  ${rows.filter(r => r.play_in_win > 0 || r.swiss < 1).sort((a, b) => b.play_in_win - a.play_in_win).map(r =>
    `<tr><td class="name">${esc(teamName(r.team))}</td>${bar(r.play_in_win)}</tr>`).join('')}
  </tbody></table></section></div>`;
}

// Recommended Swiss picks. In single-run mode each pick is checked against that run's records.
function swissPicksPanel() {
  const s = R.swiss_pickem, P = s.picks, d = s.detail;
  const tag = single() ? '<span class="single-flag">Single run</span>' : '';
  const rec = single() ? RUN().swiss_record : null;
  const hit = { '3-0': r => r === '3-0', '0-3': r => r === '0-3', advance: r => r === '3-1' || r === '3-2' };
  const li = (t, p, k) => `<li>${esc(teamName(t))}<span>${rec ? `${esc(rec[t] || '-')} <b class="${hit[k](rec[t]) ? 'match-ok' : 'match-no'}">${hit[k](rec[t]) ? '&#10003;' : '&#10007;'}</b>` : pct(p)}</span></li>`;
  const all = [...P['3-0'].map(t => ['3-0', t]), ...P['0-3'].map(t => ['0-3', t]), ...P.advance.map(t => ['advance', t])];
  const note = rec
    ? `In this run the recommended picks get <b>${all.filter(([k, t]) => hit[k](rec[t])).length}</b> of 9 right.`
    : `Maximizes expected correct picks across 2 &times; 3-0, 2 &times; 0-3 and 5 &times; advance (3-1 or 3-2), each team used once. Expected correct: <b>${num(s.expected_correct, 2)}</b> of 9.`;
  return `<section class="panel wide"><h2>Swiss picks${tag}</h2>
  <p class="note">${note}</p>
  <div class="picks">
    <div class="bucket"><h3>3-0</h3><ol>${P['3-0'].map(t => li(t, d[t]['3-0'], '3-0')).join('')}</ol></div>
    <div class="bucket"><h3>0-3</h3><ol>${P['0-3'].map(t => li(t, d[t]['0-3'], '0-3')).join('')}</ol></div>
    <div class="bucket"><h3>Advance 3-1 / 3-2</h3><ol>${P.advance.map(t => li(t, d[t].advance_3_1_or_3_2, 'advance')).join('')}</ol></div>
  </div></section>`;
}

function swissOddsPanel() {
  return `<section class="panel wide"><h2>Every team's Swiss record odds</h2><div class="scroll"><table>
  <thead><tr><th>Team</th><th>3-0</th><th>3-1</th><th>3-2</th><th>2-3</th><th>1-3</th><th>0-3</th><th>Advance</th></tr></thead><tbody>
  ${R.outcomes.filter(r => r.swiss > 0).sort((a, b) => b.quarters - a.quarters).map(r => `<tr><td class="name">${esc(teamName(r.team))}<span class="region">${esc(region(r.team))}</span></td>
    ${bar(r.swiss_3_0)}${bar(r.swiss_3_1)}${bar(r.swiss_3_2)}${bar(r.swiss_2_3)}${bar(r.swiss_1_3)}${bar(r.swiss_0_3)}${bar(r.quarters, 1, 'gold')}</tr>`).join('')}
  </tbody></table></div></section>`;
}

// Only reached when the report has no Pick'Em section (the Swiss panels live on Your Pick'Ems otherwise).
function swissView() {
  return `<div class="grid">${swissPicksPanel()}${swissOddsPanel()}</div>`;
}

function leader(title, rows, unit = '', fmt = x => num(x, 1)) {
  if (!rows || !rows.length) return '';
  const max = Math.max(...rows.map(r => r.p));
  return `<section class="panel"><h3>${title}</h3><table class="leader"><thead><tr><th>Pick</th><th>P(top)</th><th>Avg ${unit}</th><th>10&ndash;90%</th></tr></thead><tbody>
  ${rows.slice(0, 8).map(r => `<tr><td class="name">${esc(r.name)}</td>${bar(r.p, max)}<td>${fmt(r.mean)}</td><td>${fmt(r.p10)}&ndash;${fmt(r.p90)}</td></tr>`).join('')}
  </tbody></table></section>`;
}

function distPanel(title, d, unit = '') {
  let bars = '', lab = '';
  if (d.pmf) {
    const ks = Object.keys(d.pmf).map(Number).sort((a, b) => a - b), mx = Math.max(...Object.values(d.pmf));
    bars = ks.map(k => `<div title="${k}: ${pct(d.pmf[k])}" style="height:${d.pmf[k] / mx * 100}%"></div>`).join('');
    lab = `<span>${ks[0]}</span><span>${ks[ks.length - 1]}</span>`;
  } else if (d.hist) {
    const mx = Math.max(...d.hist.counts);
    bars = d.hist.counts.map(c => `<div style="height:${c / mx * 100}%"></div>`).join('');
    lab = `<span>${d.hist.edges[0]}</span><span>${d.hist.edges[d.hist.edges.length - 1]}</span>`;
  }
  return `<section class="panel"><h3>${title}</h3><div class="dist">${bars}</div><div class="distlab">${lab}</div>
  <div class="stat"><span>median</span><b>${num(d.p50, 1)}${unit}</b></div><div class="stat"><span>mean</span><b>${num(d.mean, 1)}${unit}</b></div><div class="stat"><span>10&ndash;90%</span><b>${num(d.p10, 1)}&ndash;${num(d.p90, 1)}${unit}</b></div></section>`;
}

function crystalView() {
  const S = R.scopes[scope], C = S.champions, P = S.players, T = S.teams, E = S.event;
  const scopes = { all: 'Whole event', play_in: 'Play-In', swiss: 'Swiss', knockout: 'Knockouts' };
  const seg = `<div class="seg" role="group" aria-label="Stage">${Object.entries(scopes).map(([k, v]) =>
    `<button aria-pressed="${k === scope}" data-scope="${k}">${v}</button>`).join('')}</div>`;
  const tf = x => num(x, 0), f2 = x => num(x, 2), wr = x => pct(x, 0);
  return `${seg}<p class="note">P(top) is the share of simulations where that pick finishes first (ties split). Rate questions need at least ${C.min_games} games in that simulation.</p>
  <h2>Champions</h2><div class="grid">
    ${leader('Most picked', C.most_picked, 'picks', tf)}${leader('Most banned', C.most_banned, 'bans', tf)}
    ${leader('Most picked + banned', C.most_presence, 'p+b', tf)}${leader('Most kills', C.most_kills, 'kills', tf)}
    ${leader('Highest win rate', C.highest_winrate, 'WR', wr)}${leader('Lowest win rate', C.lowest_winrate, 'WR', wr)}
    ${leader('Best KDA', C.best_kda, 'KDA', f2)}${leader('Most deaths', C.most_deaths, 'deaths', tf)}
    ${leader('Most pentakills', C.most_pentas, 'pentas', f2)}
    ${distPanel('Unique champions picked', C.unique_picked)}${distPanel('Unique champions picked or banned', C.unique_picked_or_banned)}
  </div>
  <h2 style="margin-top:22px">Players</h2><div class="grid">
    ${leader('Most kills', P.most_kills, 'kills', tf)}${leader('Most deaths', P.most_deaths, 'deaths', tf)}
    ${leader('Most assists', P.most_assists, 'assists', tf)}${leader('Highest KDA', P.highest_kda, 'KDA', f2)}
    ${leader('Most kills per game', P.most_kills_per_game, 'k/g', f2)}${leader('Most first bloods', P.most_first_bloods, 'FB', f2)}
    ${leader('Most pentakills', P.most_pentas, 'pentas', f2)}${leader('Most games played', P.most_games, 'games', tf)}
  </div>
  <h2 style="margin-top:22px">Teams</h2><div class="grid">
    ${leader('Most kills', T.most_kills, 'kills', tf)}${leader('Most kills per game', T.most_kills_per_game, 'k/g', f2)}
    ${leader('Most dragons', T.most_dragons, 'drakes', tf)}${leader('Most barons', T.most_barons, 'barons', tf)}
    ${leader('Most towers', T.most_towers, 'towers', tf)}${leader('Most first bloods', T.most_firstbloods, 'FB', tf)}
    ${leader('Longest average game', T.longest_avg_game, 'min', f2)}${leader('Shortest average game', T.shortest_avg_game, 'min', f2)}
  </div>
  <h2 style="margin-top:22px">Event</h2><div class="grid">
    ${distPanel('Games played', E.games)}${distPanel('Longest game', E.longest_game_min, ' min')}
    ${distPanel('Shortest game', E.shortest_game_min, ' min')}${distPanel('Most kills in one game', E.max_kills_in_game)}
    ${distPanel('Pentakills', E.pentakills)}
  </div>`;
}

function metaView() {
  const sim = Object.fromEntries((R.scopes.all.champions.expected_presence || []).map(r => [r.name, r]));
  const rows = R.projection;
  return `<div class="grid"><section class="panel wide"><h2>Patch 26.20 projection</h2>
  <p class="note">Pre-Worlds = share of the last 300 major-league games each champion was picked or banned in (patches ${esc(Object.keys(R.patch_mix || {}).join(', ') || '16.16&ndash;16.18')}). Projected = after applying 26.20 solo-queue movement, weighted the way past Worlds patches reacted (2&ndash;3&times; a normal patch). Simulated = what drafts in the simulation actually did.</p>
  <div class="scroll"><table><thead><tr><th>Champion</th><th>Pre-Worlds</th><th>Projected</th><th>Simulated</th><th>Sim picks</th><th>Sim bans</th><th>Sim WR</th><th>SoloQ WR</th><th>SoloQ &Delta;WR</th></tr></thead><tbody>
  ${rows.map(r => { const s = sim[r.champ] || {}; const dw = r.soloq_dwr_pp;
    return `<tr><td class="name">${esc(r.champ)}</td>${bar(r.pre)}${bar(r.projected, 1, 'gold')}${bar(s.presence_rate || 0)}<td>${num(s.picks, 1)}</td><td>${num(s.bans, 1)}</td><td>${s.winrate == null ? '&ndash;' : pct(s.winrate, 0)}</td><td>${r.soloq_wr == null ? '&ndash;' : pct(r.soloq_wr)}</td>
    <td class="${dw > 0.25 ? 'up' : dw < -0.25 ? 'down' : ''}">${dw == null ? '&ndash;' : (dw > 0 ? '+' : '') + num(dw, 2) + 'pp'}</td></tr>` }).join('')}
  </tbody></table></div></section></div>`;
}

document.getElementById('view').addEventListener('click', e => {
  const mc = e.target.closest('.match[data-g]');
  if (mc) return openSeries(OPEN[+mc.dataset.g]);
  const mb = e.target.closest('button[data-mode]');
  if (mb) { mode = mb.dataset.mode; if (mode === 'single' && !RUNS[runIdx]) runIdx = 0; try { localStorage.setItem('pk_mode', mode) } catch (e) {} return render(); }
  const rb = e.target.closest('button[data-run]');
  if (rb) {
    const n = RUNS.length, a = rb.dataset.run;
    runIdx = a === 'prev' ? (runIdx - 1 + n) % n : a === 'next' ? (runIdx + 1) % n : Math.floor(Math.random() * n);
    return render();
  }
  const b = e.target.closest('button[data-scope]'); if (!b) return;
  scope = b.dataset.scope; try { localStorage.setItem('pk_scope', scope) } catch (e) {}
  render();
});

document.getElementById('view').addEventListener('keydown', e => {
  const mc = e.target.closest('.match[data-g]');
  if (mc && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSeries(OPEN[+mc.dataset.g]) }
});

function render() {
  renderTabs();
  OPEN = [];
  const v = document.getElementById('view');
  v.innerHTML = modeBar() + (tab === 'pickems' ? pickemsView() : tab === 'bracket' ? bracketView() : tab === 'odds' ? oddsView() : tab === 'swiss' ? swissView() : tab === 'crystal' ? crystalView() : metaView());
}
render();
</script>
