// Recommended Swiss picks (2026 format): 8 advancing teams, the first three also called as the
// 3-0 / 3-1 / 3-2 team for a bonus. Cards like the brackets: one per bonus slot, one for the other 5.
// In single-run mode each pick is scored against that run's records (green = advanced, gold = exact record).
const SLOTS = ['3-0', '3-1', '3-2'];
function swissPicksPanel() {
  const s = V().swiss_pickem, P = s.picks, d = s.detail, pts = s.points;
  const tag = single() ? '<span class="single-flag">Single run</span>' : '';
  const rec = single() ? RUN().swiss_record : null;
  const adv = r => !!r && r.startsWith('3-');
  const won = (k, t) => (adv(rec[t]) ? pts.advance : 0) + (k && rec[t] === k ? pts.record : 0);
  // Single run: correct + bonus (slot pick, exact record) / correct (advanced) / incorrect.
  const VI = { ok: '<span class="vi ok">&#10003;</span>', part: '<span class="vi part">&ndash;</span>', bad: '<span class="vi bad">&#10007;</span>' };
  const state = (k, t) => !adv(rec[t]) ? 'bad' : !k || rec[t] === k ? 'ok' : 'part';
  const row = (k, t) => rec
    ? { team: t, label: `${VI[state(k, t)]}${esc(rec[t] || 'out')}${k ? ` +${won(k, t)}` : ''}`, cls: 'v-' + state(k, t) }
    : { team: t, label: k ? `${pct(d[t][k], 0)} / ${pct(d[t].advance, 0)}` : pct(d[t].advance, 0), win: true, gold: !!k };
  const cards = [...SLOTS.map(k => matchCard(rec ? `${k} \u00b7 +${pts.record} bonus` : `${k} \u00b7 exact / advance`, [row(k, P[k])])),
    matchCard(`Advance \u00b7 +${pts.advance} each`, P.advance.map(t => row(null, t)))];
  let note, legend = '', key = '';
  if (rec) {
    const got = [...SLOTS.map(k => won(k, P[k])), ...P.advance.map(t => won(null, t))].reduce((a, b) => a + b, 0);
    const mine = [...SLOTS.map(k => P[k]), ...P.advance];
    note = `In this run the recommended picks score <b>${got}</b> of ${s.max_points} points.`;
    legend = `<div class="vlegend"><span>${VI.ok} Correct: advanced (+${pts.advance}), with the slot's exact record (+${pts.record} more)</span><span>${VI.part} Partial: advanced, wrong record (+${pts.advance})</span><span>${VI.bad} Incorrect (+0)</span></div>`;
    key = `<h3 style="margin-top:14px">Who advanced in this run</h3><div class="swiss-cards">${SLOTS.map(k => matchCard(k,
      Object.keys(rec).filter(t => rec[t] === k).map(t => ({ team: t, label: mine.includes(t) ? `${VI.ok}${P[k] === t ? 'slot' : 'picked'}` : `${VI.bad}missed`, cls: mine.includes(t) ? 'v-ok' : 'v-bad' })))).join('')}</div>`;
  } else {
    note = `Pick 8 teams to advance; the first three are also called as the 3-0, 3-1 and 3-2 team. +${pts.advance} per correct advancing team, +${pts.record} bonus when a slot pick finishes with that exact record. These picks maximize expected points: <b>${num(s.expected_points, 1)}</b> of ${s.max_points} (${num(s.expected_correct, 2)} of 8 advancing). Slot cards show the chance of that exact record / of advancing.`;
  }
  return `<section class="panel wide"><h2>Swiss picks${tag}</h2><p class="note">${note}</p>${legend}
  <div class="swiss-cards">${cards.join('')}</div>${key}</section>`;
}

// Swiss matchups as a team-by-round grid (rows grouped by final record). Most likely: the known
// pairings (drawn rounds) with each side's win chance, a played series as its result, the rest TBD;
// teams by most likely record. Single run: every series of that run; cells open games & drafts.
function progGrid(teams, nR, cell, rec, recHead, adv) {
  return `<div class="scroll"><div class="sgrid" style="--nr:${nR}"><div class="ph">Team</div>${Array.from({ length: nR }, (_, i) => `<div class="ph">Round ${i + 1}</div>`).join('')}<div class="ph">${recHead}</div>
  ${teams.map((t, i) => `${i && rec(t) !== rec(teams[i - 1]) ? '<div class="gap"></div>' : ''}<div class="tm">${teamLab(t)}</div>${Array.from({ length: nR }, (_, n) => cell(t, n + 1)).join('')}<div class="rec ${adv(t) ? 'w' : 'l'}">${esc(rec(t) || '')}</div>`).join('')}
  </div></div>`;
}
const recScore = r => { const [w, l] = (r || '0-9').split('-').map(Number); return l - w * 10 };
const byRecord = (teams, rec) => [...teams].sort((a, b) => recScore(rec(a)) - recScore(rec(b)) || teams.indexOf(a) - teams.indexOf(b));
// One grid cell: opponent logo, label (W/L or a win chance), Bo3 score, pre-match win chance at right.
// cls: w / l for results, pred for predictions; g: OPEN index when the series has a game log.
const pcell = (m, t, { cls, label, score = '', pre = '', g = -1 }) => `<div class="pc ${cls}"${g >= 0 ? ` data-sg="${g}" data-gn="1" role="button" tabindex="0"` : ''} title="${esc(m.round)}: ${esc(teamName(m.a))} vs ${esc(teamName(m.b))}">${tLogo(m.a === t ? m.b : m.a)}<b>${label}</b>${score ? `<span class="s">${score}</span>` : ''}${pre ? `<span class="r">${pre}</span>` : ''}</div>`;
// Pre-match chance t beats o in a Bo{bo} Swiss series (report.swiss_h2h: over every simulation where they met).
const swissH2H = (t, o, bo) => { const p = (R.swiss_h2h || {})[t < o ? `${t}|${o}|${bo}` : `${o}|${t}|${bo}`]; return p == null ? null : t < o ? p : 1 - p };

function swissMatchupsPanel() {
  if (single()) return swissProgression('<span class="single-flag">Single run</span>');
  const M = V().swiss_matchups || [];
  if (!M.length) return '';
  const recs = V().records || R.knockout.records, rec = t => recs[t];
  const rn = m => +m.round.slice(1).split(' ')[0], r1 = M.filter(m => rn(m) === 1).flatMap(m => [m.a, m.b]);
  const cell = (t, n) => {
    const m = M.find(m => rn(m) === n && (m.a === t || m.b === t));
    if (!m) return '<div class="pc tbd">TBD</div>';
    const P = playedSeries('swiss', m.round, m.a, m.b);
    if (P) { const w = P.winner === t, [x, y] = P.a === t ? [P.wa, P.wb] : [P.wb, P.wa]; return pcell(m, t, { cls: w ? 'w' : 'l', label: w ? 'W' : 'L', score: x + y > 1 ? `${x}-${y}` : '' }) }
    const p = m.a === t ? m.p_a : 1 - m.p_a;
    return pcell(m, t, { cls: 'pred' + (p >= 0.5 ? ' fav' : ''), label: pct(p, 0) });
  };
  return `<section class="panel wide"><h2>Swiss matchups</h2>
  <p class="note">Drawn series with each team's chance to win, the favourite highlighted in blue; played series show the result in green / red. Later rounds fill in once drawn. Teams grouped by most likely final record.</p>
  ${progGrid(byRecord(r1, rec), 5, cell, rec, 'Likely', t => (rec(t) || '').startsWith('3-'))}</section>`;
}

function swissProgression(tag) {
  const sw = RUN().swiss, rec = t => RUN().swiss_record[t], rn = m => +m.round.slice(1).split(' ')[0];
  const nR = Math.max(...sw.map(rn)), r1 = sw.filter(m => rn(m) === 1).flatMap(m => [m.a, m.b]);
  const cell = (t, n) => {
    const m = sw.find(m => rn(m) === n && (m.a === t || m.b === t));
    if (!m) return '<div></div>';
    const w = m.winner === t, [x, y] = m.a === t ? [m.wa, m.wb] : [m.wb, m.wa];
    const opp = m.a === t ? m.b : m.a, bo = x + y > 1 ? 3 : 1, p = swissH2H(t, opp, bo);
    return pcell(m, t, { cls: w ? 'w' : 'l', label: w ? 'W' : 'L', score: bo > 1 ? `${x}-${y}` : '', pre: p == null ? '' : pct(p, 0), g: m.games ? OPEN.push(m) - 1 : -1 });
  };
  return `<section class="panel wide"><h2>Swiss matchups${tag}</h2>
  <p class="note">Every Swiss series in this simulation, teams by final record: each cell is that round's opponent, the result and Bo3 score, and at right the pre-match chance to win that series (over every simulation where the two met in that format). Click a cell for games &amp; drafts.</p>
  ${progGrid(byRecord(r1, rec), nR, cell, rec, 'Record', t => (rec(t) || '').startsWith('3-'))}</section>`;
}

function swissOddsPanel() {
  const rec = single() ? RUN().swiss_record : null, tag = single() ? '<span class="single-flag">Single run</span>' : '';
  return `<section class="panel wide"><h2>Swiss record odds${tag}</h2>${rec ? '<p class="note">Pre-simulation odds; the record each team got in this run is outlined.</p>' : ''}<div class="scroll"><table>
  <thead><tr><th>Team</th><th>3-0</th><th>3-1</th><th>3-2</th><th>2-3</th><th>1-3</th><th>0-3</th><th>Advance</th>${rec ? '<th>This run</th>' : ''}</tr></thead><tbody>
  ${V().outcomes.filter(r => r.swiss > 0).sort((a, b) => b.quarters - a.quarters || b.swiss_3_0 - a.swiss_3_0 || a.swiss_0_3 - b.swiss_0_3 || b.champion - a.champion || a.team.localeCompare(b.team)).map(r => `<tr><td class="name"><span class="lab">${tLogo(r.team)}<span>${esc(teamName(r.team))}</span><span class="region">${esc(region(r.team))}</span></span></td>
    ${RECORDS.map(k => bar(r['swiss_' + k.replace('-', '_')], 1, rec && rec[r.team] === k ? 'hitrec' : '')).join('')}${bar(r.quarters, 1, 'gold')}${rec ? `<td>${esc(rec[r.team] || 'out')}</td>` : ''}</tr>`).join('')}
  </tbody></table></div></section>`;
}

// Only reached when the report has no Pick'Em section (the Swiss panels live on Your Pick'Ems otherwise).
function swissView() {
  return `<div class="grid">${swissPicksPanel()}${swissMatchupsPanel()}${swissOddsPanel()}</div>`;

// Games already played (pickems.sim.played): every champion stat splits into what those games did
// (the same in every simulation), what's predicted for the games still ahead, and the total.
const hasPlayed = () => (R.played || []).length > 0;
const ACT = (sc = scope) => ((R.actual || {})[sc] || { games: 0, champ: {} });
const actC = (name, sc) => ACT(sc).champ[name] || { picks: 0, bans: 0, wins: 0, kills: 0, deaths: 0, assists: 0, pentas: 0 };
// played(name): a count (the table adds Predicted = average total - played) or a string (a rate's W-L so far).
const PLAYED = {
  count: k => n => k === 'presence' ? actC(n).picks + actC(n).bans : actC(n)[k],
  wl: (n, sc) => { const a = actC(n, sc); return a.picks ? `${a.wins}-${a.picks - a.wins}` : '&ndash;' },
  kda: n => { const a = actC(n); return a.picks ? `${a.kills} / ${a.deaths} / ${a.assists}` : '&ndash;' },
};
// Stat leader boards: top LB_TOP rows until expanded. LB_SEC names the section being built
// (champions / players / teams), so same-titled boards in different sections expand separately.
const LB_OPEN = new Set(), LB_TOP = 8;
let LB_SEC = '';
const lbSec = s => (LB_SEC = s, '');
// capped: a given-champion view's aggregate boards ship only their top rows.
const lbMore = (key, n, capped) => n > LB_TOP ? `<button class="expand" data-lbexpand="${esc(key)}">${LB_OPEN.has(key) ? `Show top ${LB_TOP}` : `Show ${capped ? 'top' : 'all'} ${n} ${LB_SEC}`}</button>` : '';
function leader(title, rows, unit = '', fmt = x => num(x, 1), played) {
  if (!rows || !rows.length) return '';
  const key = LB_SEC + ':' + title, open = LB_OPEN.has(key);
  const max = Math.max(...rows.map(r => r.p)), P = played && hasPlayed() ? played : null, sum = P && typeof P(rows[0].name) === 'number';
  return `<section class="panel"><h3>${title}</h3><div class="scroll"><table class="leader"><thead><tr><th>Pick</th><th>P(top)</th>${P ? `<th>Actual</th>${sum ? '<th>Predicted</th>' : ''}` : ''}<th>Avg ${P ? 'total ' : ''}${unit}</th><th>10&ndash;90%</th></tr></thead><tbody>
  ${(open ? rows : rows.slice(0, LB_TOP)).map(r => `<tr><td class="name">${withIcon(r.name)}</td>${bar(r.p, max)}${P ? `<td>${sum ? num(P(r.name), 0) : P(r.name)}</td>${sum ? `<td>${fmt(r.mean - P(r.name))}</td>` : ''}` : ''}<td>${fmt(r.mean)}</td><td>${fmt(r.p10)}&ndash;${fmt(r.p90)}</td></tr>`).join('')}
  </tbody></table></div>${lbMore(key, rows.length, !!given)}</section>`;
}

function distPanel(title, d, unit = '', played) {
  let bars = '', lab = '';
  if (d.pmf) {
    const ks = Object.keys(d.pmf).map(Number).sort((a, b) => a - b), mx = Math.max(...Object.values(d.pmf));
    bars = ks.map(k => `<div title="${k}: ${pct(d.pmf[k])}" style="height:${d.pmf[k] / mx * 100}%"></div>`).join('');
    lab = `<span>${ks[0]}</span><span>${ks[ks.length - 1]}</span>`;
  } else if (d.hist) {
    const mx = Math.max(...d.hist.counts);
    bars = d.hist.counts.map(c => `<div style="height:${c / mx * 100}%"></div>`).join('');
    lab = `<span>${d.hist.edges[0]}</span><span>${d.hist.edges[d.hist.edges.length - 1]}</span>`;
  }
  return `<section class="panel"><h3>${title}</h3><div class="dist">${bars}</div><div class="distlab">${lab}</div>
  ${played != null && hasPlayed() ? `<div class="stat"><span>played so far</span><b>${num(played, 0)}${unit}</b></div>` : ''}<div class="stat"><span>median</span><b>${num(d.p50, 1)}${unit}</b></div><div class="stat"><span>mean</span><b>${num(d.mean, 1)}${unit}</b></div><div class="stat"><span>10&ndash;90%</span><b>${num(d.p10, 1)}&ndash;${num(d.p90, 1)}${unit}</b></div></section>`;
}

const STAGE_SEG = () => `<div class="seg" role="group" aria-label="Stage">${Object.entries(STAGE_LABEL).map(([k, v]) =>
  `<button aria-pressed="${k === scope}" data-scope="${k}">${v}</button>`).join('')}</div>`;

// One run's leaderboard: the top LB_TOP by `f` until expanded, with each one's pre-sim P(top)
// from the aggregate table of the same name. Ties in `f` go by that table's order (P(top), then
// simulated average), then name; # shows the shared rank.
function leaderRun(title, list, f, fmt, agg, label, extra, played) {
  const at = Object.fromEntries((agg || []).map((r, j) => [r.name, j])), pos = x => at[label(x)] ?? Infinity;
  const rows = list.filter(x => isFinite(f(x))).sort((a, b) => f(b) - f(a) || pos(a) - pos(b) || String(label(a)).localeCompare(label(b)));
  if (!rows.length) return '';
  const key = LB_SEC + ':' + title, shown = LB_OPEN.has(key) ? rows : rows.slice(0, LB_TOP), best = f(rows[0]);
  const P = Object.fromEntries((agg || []).map(r => [r.name, r.p])), max = Math.max(...shown.map(f), 1e-9);
  const Pl = played && hasPlayed() ? played : null, sum = Pl && typeof Pl(label(shown[0])) === 'number';
  return `<section class="panel"><h3>${title}</h3><div class="scroll"><table class="leader"><thead><tr><th>#</th><th>Pick</th>${Pl ? `<th>Actual</th>${sum ? '<th>Simulated</th>' : ''}` : ''}<th>This run${Pl ? ' (total)' : ''}</th>${extra ? `<th>${extra[0]}</th>` : ''}<th>Pre-sim P(top)</th></tr></thead><tbody>
  ${shown.map(x => { const r = 1 + rows.filter(y => f(y) > f(x)).length, l = label(x);
    return `<tr${f(x) === best ? ' style="background:var(--gold-soft)"' : ''}><td>${r}</td><td class="name">${withIcon(l)}</td>${Pl ? `<td>${sum ? num(Pl(l), 0) : Pl(l)}</td>${sum ? `<td>${num(f(x) - Pl(l), 0)}</td>` : ''}` : ''}<td class="cell"><i style="width:${Math.max(0, f(x)) / max * 100}%"></i>${fmt(f(x))}</td>${extra ? `<td>${extra[1](x)}</td>` : ''}<td>${P[l] != null ? pct(P[l], 1) : '&ndash;'}</td></tr>` }).join('')}
  </tbody></table></div>${lbMore(key, rows.length)}</section>`;
}
// One run's value for an event stat, against the aggregate distribution (its bar is gold).
function eventRun(title, v, d, unit = '') {
  if (v == null || !isFinite(v)) return '';
  let pctile = '';
  if (d.pmf) { let below = 0; for (const [k, p] of Object.entries(d.pmf)) if (+k < v) below += p; pctile = `higher than ${pct(below, 0)} of simulations` }
  return `<section class="panel"><h3>${title}</h3><div class="ans"><span class="big">${num(v, Number.isInteger(v) ? 0 : 1)}${unit}</span><span class="answer-p">${pctile}</span></div>${distBars(d, v, true)}
  <div class="stat"><span>sim median &middot; 10&ndash;90%</span><b>${num(d.p50, 1)} &middot; ${num(d.p10, 1)}&ndash;${num(d.p90, 1)}${unit}</b></div></section>`;
}
function crystalRunView() {
  const run = RUN(), A = runAgg(run, scope), S = V().scopes[scope], C = S.champions, P = S.players, T = S.teams, E = S.event;
  if (!A.games.length) return `${STAGE_SEG()}<p class="note">No games logged in this stage for this run.</p>`;
  const tag = '<span class="single-flag">Single run</span>', mg = C.min_games, all = scope === 'all';
  const tf = x => num(x, 0), f2 = x => num(x, 2), wr = x => pct(x, 0);
  const ce = A.champ.filter(c => c.picks >= mg), pe = A.pl.filter(p => p.games >= mg), cl = c => c.c, pl = p => p.label, tl = t => t.t;
  const mk = (p, j) => ((run.pmk || {})[PIX[p.t + '|' + ROLE_KEYS[p.r]]] || [0, 0, 0, 0, 0])[j];
  const lens = A.games.map(e => e.g.len), hasObj = A.team.every(t => t.obj);
  const objL = (title, j, agg) => hasObj ? leaderRun(title, A.team, t => t.obj[j], tf, agg, tl) : '';
  return `${STAGE_SEG()}<p class="note">What happened in simulation #${run.id + 1}${all ? '' : ` (${STAGE_LABEL[scope]} only)`}. Gold rows lead. Pre-sim P(top) is each pick's chance of leading across ${given ? `the simulations ${esc(teamName(given))} wins` : 'all simulations'}; ties in this run are ordered by it. Rate boards need ${mg} games in this run.</p>
  ${lbSec('champions')}<h2>Champions${tag}</h2><div class="grid lb">
    ${leaderRun('Most picked', A.champ, c => c.picks, tf, C.most_picked, cl, null, PLAYED.count('picks'))}${leaderRun('Most banned', A.champ, c => c.bans, tf, C.most_banned, cl, null, PLAYED.count('bans'))}
    ${leaderRun('Most picked + banned', A.champ, c => c.picks + c.bans, tf, C.most_presence, cl, ['Presence', c => pct((c.picks + c.bans) / A.games.length, 0)], PLAYED.count('presence'))}${leaderRun('Most kills', A.champ, c => c.k, tf, C.most_kills, cl, null, PLAYED.count('kills'))}
    ${leaderRun('Highest win rate', ce, c => c.wins / c.picks, wr, C.highest_winrate, cl, ['W-L', c => `${c.wins}-${c.picks - c.wins}`], PLAYED.wl)}${leaderRun('Lowest win rate', ce, c => 1 - c.wins / c.picks, x => pct(1 - x, 0), C.lowest_winrate, cl, ['W-L', c => `${c.wins}-${c.picks - c.wins}`], PLAYED.wl)}
    ${leaderRun('Best KDA', ce, c => (c.k + c.a) / Math.max(c.d, 1), f2, C.best_kda, cl, ['K / D / A', c => `${c.k} / ${c.d} / ${c.a}`], PLAYED.kda)}${leaderRun('Most deaths', A.champ, c => c.d, tf, C.most_deaths, cl, null, PLAYED.count('deaths'))}
    ${eventRun('Unique champions picked', A.champ.filter(c => c.picks).length, C.unique_picked)}${eventRun('Unique champions picked or banned', A.champ.length, C.unique_picked_or_banned)}
  </div>
  ${lbSec('players')}<h2 style="margin-top:22px">Players${tag}</h2><div class="grid lb">
    ${leaderRun('Most kills', A.pl, p => p.k, tf, P.most_kills, pl)}${leaderRun('Most deaths', A.pl, p => p.d, tf, P.most_deaths, pl)}
    ${leaderRun('Most assists', A.pl, p => p.a, tf, P.most_assists, pl)}${leaderRun('Highest KDA', pe, p => (p.k + p.a) / Math.max(p.d, 1), f2, P.highest_kda, pl, ['K / D / A', p => `${p.k} / ${p.d} / ${p.a}`])}
    ${leaderRun('Most kills per game', pe, p => p.k / p.games, f2, P.most_kills_per_game, pl, ['Games', p => p.games])}
    ${all ? leaderRun('Most first bloods', A.pl.filter(p => mk(p, 0) > 0), p => mk(p, 0), tf, P.most_first_bloods, pl) + leaderRun('Most pentakills', A.pl.filter(p => mk(p, 4) > 0), p => mk(p, 4), tf, P.most_pentas, pl) : ''}
    ${leaderRun('Most games played', A.pl, p => p.games, tf, P.most_games, pl)}
  </div>
  ${lbSec('teams')}<h2 style="margin-top:22px">Teams${tag}</h2><div class="grid lb">
    ${leaderRun('Most kills', A.team, t => t.k, tf, T.most_kills, tl)}${leaderRun('Most kills per game', A.team.filter(t => t.games >= 3), t => t.k / t.games, f2, T.most_kills_per_game, tl, ['Games', t => t.games])}
    ${objL('Most dragons', 1, T.most_dragons)}${objL('Most barons', 2, T.most_barons)}${objL('Most towers', 0, T.most_towers)}
    ${leaderRun('Most first bloods', A.team, t => t.fb, tf, T.most_firstbloods, tl)}
    ${leaderRun('Longest average game', A.team.filter(t => t.games >= 3), t => t.secs / t.games / 60, f2, T.longest_avg_game, tl, ['Games', t => t.games])}
    ${leaderRun('Shortest average game', A.team.filter(t => t.games >= 3), t => -t.secs / t.games / 60, x => num(-x, 2), T.shortest_avg_game, tl, ['Games', t => t.games])}
  </div>${hasObj ? '' : '<p class="note">Dragons, barons and towers were not logged for this run.</p>'}
  <h2 style="margin-top:22px">Event${tag}</h2><div class="grid">
    ${eventRun('Games played', A.games.length, E.games)}${eventRun('Longest game', Math.max(...lens), E.longest_game_min, ' min')}
    ${eventRun('Shortest game', Math.min(...lens), E.shortest_game_min, ' min')}${eventRun('Most kills in one game', Math.max(...A.games.map(e => e.g.bk + e.g.rk)), E.max_kills_in_game)}
    ${all ? eventRun('Pentakills', Object.values(run.pmk || {}).reduce((s, x) => s + x[4], 0), E.pentakills) : ''}
  </div>`;
}

function crystalView() {
  if (single()) return crystalRunView();
  const S = V().scopes[scope], C = S.champions, P = S.players, T = S.teams, E = S.event;
  const seg = STAGE_SEG();
  const tf = x => num(x, 0), f2 = x => num(x, 2), wr = x => pct(x, 0);
  return `${seg}<p class="note">P(top) is the share of simulations where that pick finishes first (ties split). Rate questions need at least ${C.min_games} games in that simulation.${hasPlayed() ? ` Champion boards split each average into Actual (the ${ACT().games} real games${scope === 'all' ? '' : ` of this stage`} so far, the same in every simulation), Predicted (the simulated average for the games still ahead) and the total.` : ''}</p>
  ${lbSec('champions')}<h2>Champions</h2><div class="grid lb">
    ${leader('Most picked', C.most_picked, 'picks', tf, PLAYED.count('picks'))}${leader('Most banned', C.most_banned, 'bans', tf, PLAYED.count('bans'))}
    ${leader('Most picked + banned', C.most_presence, 'p+b', tf, PLAYED.count('presence'))}${leader('Most kills', C.most_kills, 'kills', tf, PLAYED.count('kills'))}
    ${leader('Highest win rate', C.highest_winrate, 'WR', wr, PLAYED.wl)}${leader('Lowest win rate', C.lowest_winrate, 'WR', wr, PLAYED.wl)}
    ${leader('Best KDA', C.best_kda, 'KDA', f2, PLAYED.kda)}${leader('Most deaths', C.most_deaths, 'deaths', tf, PLAYED.count('deaths'))}
    ${leader('Most pentakills', C.most_pentas, 'pentas', f2, PLAYED.count('pentas'))}
    ${distPanel('Unique champions picked', C.unique_picked, '', Object.values(ACT().champ).filter(c => c.picks).length)}${distPanel('Unique champions picked or banned', C.unique_picked_or_banned, '', Object.keys(ACT().champ).length)}
  </div>
  ${lbSec('players')}<h2 style="margin-top:22px">Players</h2><div class="grid lb">
    ${leader('Most kills', P.most_kills, 'kills', tf)}${leader('Most deaths', P.most_deaths, 'deaths', tf)}
    ${leader('Most assists', P.most_assists, 'assists', tf)}${leader('Highest KDA', P.highest_kda, 'KDA', f2)}
    ${leader('Most kills per game', P.most_kills_per_game, 'k/g', f2)}${leader('Most first bloods', P.most_first_bloods, 'FB', f2)}
    ${leader('Most pentakills', P.most_pentas, 'pentas', f2)}${leader('Most games played', P.most_games, 'games', tf)}
  </div>
  ${lbSec('teams')}<h2 style="margin-top:22px">Teams</h2><div class="grid lb">
    ${leader('Most kills', T.most_kills, 'kills', tf)}${leader('Most kills per game', T.most_kills_per_game, 'k/g', f2)}
    ${leader('Most dragons', T.most_dragons, 'drakes', tf)}${leader('Most barons', T.most_barons, 'barons', tf)}
    ${leader('Most towers', T.most_towers, 'towers', tf)}${leader('Most first bloods', T.most_firstbloods, 'FB', tf)}
    ${leader('Longest average game', T.longest_avg_game, 'min', f2)}${leader('Shortest average game', T.shortest_avg_game, 'min', f2)}
  </div>
  <h2 style="margin-top:22px">Event</h2><div class="grid">
    ${distPanel('Games played', E.games)}${distPanel('Longest game', E.longest_game_min, ' min')}
    ${distPanel('Shortest game', E.shortest_game_min, ' min')}${distPanel('Most kills in one game', E.max_kills_in_game)}
    ${distPanel('Pentakills', E.pentakills)}
  </div>`;
}

let META_SORT = 'sim';
function metaView() {
  const s = single(), sim = Object.fromEntries((V().scopes.all.champions.expected_presence || []).map(r => [r.name, r]));
  // Single run: the simulated columns become this run's own drafts.
  if (s) { const A = runAgg(RUN()), N = A.games.length;
    for (const k in sim) sim[k] = { presence_rate: 0, picks: 0, bans: 0, winrate: null };
    for (const c of A.champ) sim[c.c] = { presence_rate: (c.picks + c.bans) / Math.max(N, 1), picks: c.picks, bans: c.bans, winrate: c.picks ? c.wins / c.picks : null, wl: `${c.wins}-${c.picks - c.wins}` } }
  const simName = c => sim[c] ? c : c === 'Nunu' ? 'Nunu & Willump' : c, pg = (R.patch_games || {}).target_games || 0, hp = hasPlayed();
  const d0 = s ? 0 : 1, run = s ? 'This run' : 'Simulated', wr = x => x == null ? '&ndash;' : pct(x, 0);
  // One row per champion: projection `r`, simulated `x` (totals; this run's own if single), played `a`.
  const items = R.projection.map(r => { const n = simName(r.champ); return { r, x: sim[n] || {}, a: actC(n, 'all'), n } });
  // Columns: key, section, header, sort value, cell. Actual / simulated / total when real games are in.
  const split = (grp, k) => hp ? [
    { key: k + '_pl', grp, sub: 'Actual', v: o => o.a[k], cell: o => `<td>${o.a[k]}</td>` },
    { key: k + '_sim', grp, sub: 'Simulated', v: o => (o.x[k] || 0) - o.a[k], cell: o => `<td>${num((o.x[k] || 0) - o.a[k], d0)}</td>` },
    { key: k, grp, sub: 'Total', v: o => o.x[k] || 0, cell: o => `<td>${num(o.x[k] || 0, d0)}</td>` },
  ] : [{ key: k, grp, sub: run, v: o => o.x[k] || 0, cell: o => `<td>${num(o.x[k] || 0, d0)}</td>` }];
  const cols = [
    { key: 'name', sub: 'Champion', v: o => o.r.champ, cell: o => `<td class="name">${withIcon(o.r.champ)}</td>` },
    { key: 'pre', grp: 'Presence', sub: 'Pre-Worlds', v: o => o.r.pre_raw ?? o.r.pre, cell: o => bar(o.r.pre_raw ?? o.r.pre) },
    { key: 'proj', grp: 'Presence', sub: 'Projected', v: o => o.r.projected_raw ?? o.r.projected, cell: o => bar(o.r.projected_raw ?? o.r.projected, 1, 'gold') },
    ...(pg ? [{ key: 'act', grp: 'Presence', sub: 'Actual', v: o => o.r.played_raw ?? o.r.played, cell: o => (o.r.played_raw ?? o.r.played) == null ? '<td>&ndash;</td>' : bar(o.r.played_raw ?? o.r.played) }] : []),
    { key: 'sim', grp: 'Presence', sub: run, v: o => o.x.presence_rate || 0, cell: o => bar(o.x.presence_rate || 0) },
    ...split('Picks', 'picks'), ...split('Bans', 'bans'),
    ...(hp ? [{ key: 'wl', grp: 'Results', sub: s ? 'Played' : 'W-L', v: o => o.a.picks ? o.a.wins / o.a.picks : null, cell: o => `<td>${PLAYED.wl(o.n, 'all')}</td>` }] : []),
    { key: 'wr', grp: 'Results', sub: s ? (hp ? 'This run' : 'W-L') : 'Sim WR', v: o => s && !o.x.picks ? null : o.x.winrate,
      cell: o => `<td>${s ? (o.x.wl && o.x.picks ? `${o.x.wl} (${pct(o.x.winrate, 0)})` : '&ndash;') : wr(o.x.winrate)}</td>` },
    { key: 'sq_wr', grp: 'SoloQ', sub: 'WR', v: o => o.r.soloq_wr, cell: o => `<td>${o.r.soloq_wr == null ? '&ndash;' : pct(o.r.soloq_wr)}</td>` },
    { key: 'sq_dwr', grp: 'SoloQ', sub: '&Delta;WR', v: o => o.r.soloq_dwr_pp, cell: o => { const dw = o.r.soloq_dwr_pp;
      return `<td class="${dw > 0.25 ? 'up' : dw < -0.25 ? 'down' : ''}">${dw == null ? '&ndash;' : (dw > 0 ? '+' : '') + num(dw, 2) + 'pp'}</td>` } },
    { key: 'sq_pick', grp: 'SoloQ', sub: 'Pick', v: o => o.r.soloq_pick, cell: o => `<td>${pct(o.r.soloq_pick, 1)}</td>` },
    { key: 'sq_ban', grp: 'SoloQ', sub: 'Ban', v: o => o.r.soloq_ban, cell: o => `<td>${pct(o.r.soloq_ban, 1)}</td>` },
    { key: 'sq_mult', grp: 'SoloQ', sub: 'Mult', v: o => o.r.soloq_mult, cell: o => { const m = o.r.soloq_mult;
      return `<td class="${m > 1.05 ? 'up' : m < 0.95 ? 'down' : ''}">${m == null ? '&ndash;' : '&times;' + num(m, 2)}</td>` } },
  ];
  const sc = cols.find(c => c.key === META_SORT) || cols.find(c => c.key === 'sim');
  // Ties by simulated presence, then the other columns left to right, then name.
  const rows = sortRows(items, sc, [cols.find(c => c.key === 'sim'), ...cols.slice(1), cols[0]]);
  return `<div class="grid"><section class="panel wide"><h2>Patch 26.20 projection${s ? '<span class="single-flag">Single run</span>' : ''}</h2>
  <p class="note">All ${rows.length} champions; click a header to sort (default: ${s ? 'this run' : 'simulated'} presence). Pre-Worlds = share of the last 300 major-league games before 26.20 each champion was picked or banned in (patches ${esc(Object.keys(R.patch_mix || {}).join(', ') || '16.16&ndash;16.18')}). SoloQ pick/ban = 26.20 solo-queue pick and ban rates; SoloQ mult = the patch-driven presence multiplier the draft simulator applies (before its exponent). Projected = after applying 26.20 solo-queue movement, weighted the way past Worlds patches reacted (2&ndash;3&times; a normal patch)${pg ? `, then blended with the ${pg} Worlds games already played on 26.20 (Actual, Worlds only; the projection counts as ${num(R.patch_games.prior_games, 0)} games, so real games take over as they come in)` : ''}. ${s ? `This run = what drafts did in simulation #${RUN().id + 1} (${runAgg(RUN()).games.length} games): presence, total picks, bans and W-L.` : 'Simulated = what drafts in the simulation actually did (picks and bans are averages per simulation).'}${hp ? ` Picks and bans: actual = the ${ACT('all').games} real games so far (the same in every simulation); simulated = ${s ? 'the rest of this run' : 'the simulated average for the games still ahead'}; total = both.` : ''}</p>
  <div class="scroll"><table>${sortHead(cols, sc.key, 'data-metasort')}<tbody>
  ${rows.map(o => `<tr>${cols.map(c => c.cell(o)).join('')}</tr>`).join('')}
  </tbody></table></div></section></div>`;
}

// --- Elo & players -------------------------------------------------------------------
const ROLE_KEYS = ['top', 'jng', 'mid', 'bot', 'sup'];
const PCOL = Object.fromEntries((R.player_stat_cols || []).map((c, i) => [c, i]));
const PIX = {}, PIXN = {};  // team|role -> the starter; team|role|name -> player
for (const p of PS) { PIX[p.team + '|' + p.role] ??= p.i; PIXN[p.team + '|' + p.role + '|' + p.name] = p.i }
const STAGE_LABEL = { all: 'Whole event', play_in: 'Play-In', swiss: 'Swiss', knockout: 'Knockouts' };
const elo0 = x => x == null || isNaN(x) ? '&ndash;' : Math.round(x).toLocaleString();
// Team and player Elo move by hundredths a game, so those tables show two decimals.
const elo2 = x => x == null || isNaN(x) ? '&ndash;' : x.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const delta = (a, b, dp = 0) => { const d = b - a, eps = dp ? 0.5 * 10 ** -dp : 0.5; return a == null || b == null ? '<td>&ndash;</td>' : `<td class="${d > eps ? 'up' : d < -eps ? 'down' : ''}">${d > eps ? '+' : ''}${num(Math.abs(d) < eps ? 0 : d, dp)}</td>` };
const kdaOf = (k, d, a, perSim) => perSim ? (d > 0 ? (k + a) / d : k + a) : (k + a) / Math.max(d, 1);

// One simulated run's box-score lines per player: i -> [{stage, round, opp, champ, win, k, d, a, cs, dmg, gold, tk, len}].
const LINES = {};
function runLines() {
  if (LINES[RUN().id]) return LINES[RUN().id];
  const out = {}, run = RUN();
  for (const stage of ['play_in', 'swiss', 'knockout']) for (const m of run[stage]) for (const g of (m.games || [])) {
    for (const [t, champs, lines, won, tk, opp, names] of [[g.blue, g.bc, g.bp, g.blue_win, g.bk, g.red, g.bn], [g.red, g.rc, g.rp, !g.blue_win, g.rk, g.blue, g.rn]])
      lines.forEach((l, r) => {
        const i = (names && names[r] && PIXN[t + '|' + ROLE_KEYS[r] + '|' + names[r]]) ?? PIX[t + '|' + ROLE_KEYS[r]]; if (i == null) return;
        (out[i] ||= []).push({ e: { stage, m, g }, stage, round: m.round, g: g.g, opp, champ: CH(champs[r]), win: won, k: l[0], d: l[1], a: l[2], cs: l[3], dmg: l[4], gold: l[5], tk, len: g.len });
      });
  }
  return LINES[RUN().id] = out;
}
function totals(ls) {
  const t = { games: ls.length, wins: 0, kills: 0, deaths: 0, assists: 0, cs: 0, damage: 0, team_kills: 0 };
  for (const l of ls) { t.wins += l.win; t.kills += l.k; t.deaths += l.d; t.assists += l.a; t.cs += l.cs; t.damage += l.dmg; t.team_kills += l.tk }
  return t;
}
// A player's totals for one stage: averages per simulation, or this run's actual numbers.
function playerTotals(i, stage) {
  if (single()) {
    const ls = (runLines()[i] || []).filter(l => stage === 'all' || l.stage === stage), t = totals(ls);
    const mk = stage === 'all' ? (RUN().pmk || {})[i] || [0, 0, 0, 0, 0] : null;
    if (mk) [t.firstbloods, t.doubles, t.triples, t.quadras, t.pentas] = mk;
    return t;
  }
  const st = PSV()[i].stages[stage], m = st.mean, t = { p_played: st.p_played };
  for (const c in PCOL) t[c] = m[PCOL[c]];
  return t;
}

let ELO_SORT = { team: 'fin', player: 'fin' };
// Elo columns for a team or player table, each group in the order Blended, Region, team / player (`own`): Pre-Worlds (the blended Elo, the adjustment from blending in the region's rating, the full team / player Elo), then Current and
// Predicted/Final. `of(o)` -> { e, fin, rawFin }.
function eloCols(E, s, of, d, own) {
  const f = d ? elo2 : elo0;
  const cell = x => x == null ? '<td>&ndash;</td>' : `<td>${f(x)}</td>`;
  const adj = x => x == null ? '<td>&ndash;</td>' : `<td>${x < 0 ? '&minus;' : '+'}${f(Math.abs(x))}</td>`;
  const P = o => { const { e, fin, rawFin } = of(o), has = !!(e.raw && rawFin != null), b = E.played ? e.pre : e.start, r0 = has ? (E.played ? e.raw.pre : e.raw.start) : null;
    return { pre: b, now: e.start, fin, raw: { pre: r0, now: has ? e.raw.start : null, fin: has ? rawFin : null }, has }; };
  const hasRaw = E.teams[0].raw != null;
  const val = (o, w) => P(o)[w], rawOf = (o, w) => P(o).raw[w], adjOf = (o, w) => P(o).has ? P(o)[w] - P(o).raw[w] : null;
  const dc = x => x == null ? '<td>&ndash;</td>' : delta(0, x, d);
  const pre = [
    { key: 'pre', grp: 'Pre-Worlds', sub: 'Blended', v: o => val(o, 'pre'), cell: o => cell(val(o, 'pre')) },
    ...(hasRaw ? [
      { key: 'pre_reg', grp: 'Pre-Worlds', sub: 'Region', v: o => adjOf(o, 'pre'), cell: o => adj(adjOf(o, 'pre')) },
      { key: 'pre_own', grp: 'Pre-Worlds', sub: own, v: o => rawOf(o, 'pre'), cell: o => cell(rawOf(o, 'pre')) },
    ] : []),
  ];
  // Current / Predicted: the blended Elo, then how much the region's adjustment and the team's / player's own Elo moved since Pre-Worlds.
  const later = (g, k, w) => [
    { key: k, grp: g, sub: 'Blended', v: o => val(o, w), cell: o => cell(val(o, w)) },
    ...(hasRaw ? [
      { key: k + '_reg', grp: g, sub: 'Region \u0394', v: o => { const a = adjOf(o, w); return a == null ? null : a - adjOf(o, 'pre') }, cell: o => { const a = adjOf(o, w); return dc(a == null ? null : a - adjOf(o, 'pre')) } },
      { key: k + '_own', grp: g, sub: own + ' \u0394', v: o => { const r = rawOf(o, w); return r == null ? null : r - rawOf(o, 'pre') }, cell: o => { const r = rawOf(o, w); return dc(r == null ? null : r - rawOf(o, 'pre')) } },
    ] : []),
  ];
  return [...pre, ...(E.played ? later('Current', 'now', 'now') : []), ...later(s ? 'Final' : 'Predicted', 'fin', 'fin')];
}
// Rows sorted by the column named in ELO_SORT[kind] (highest first, names A-Z, blanks last);
// ties by predicted / final Elo, the other columns, then name.
function eloSort(kind, cols, rows, extra) {
  const all = [...extra, ...cols], sc = all.find(c => c.key === ELO_SORT[kind]) || cols.find(c => c.key === 'fin');
  sortRows(rows, sc, [cols.find(c => c.key === 'fin'), ...cols, ...extra.slice(1), extra[0]]);
  return sc;
}
function eloTable(kind, cols, rows, extra, tail, sc) {
  return `<div class="scroll"><table>${sortHead([...extra, ...cols, ...tail], sc.key, 'data-elo' + kind)}<tbody>
    ${rows.map(o => `<tr>${[...extra, ...cols, ...tail].map(c => c.cell(o)).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// Explanatory note under an Elo table.
function eloNote(E, s, who, own) {
  return `Pre-Worlds shows the Blended Elo the model actually uses, the Region adjustment (what blending in the league's rating, as draftpredict does on cross-region games, adds or removes) and ${who}'s full Elo (Blended = Region + full). ${E.played ? 'Current (after the real games played so far) and ' : ''}${s ? 'Final (after this simulation)' : 'Predicted (average across simulations)'} show the Blended Elo, then how much Region and ${own} each changed since Pre-Worlds. Click a header to sort.`;
}

function eloView() {
  if (playerSel != null) return playerView(playerSel);
  const s = single(), run = s ? RUN() : null, E = V().elo && (!s || run.elo) ? V().elo : null;
  const tag = s ? '<span class="single-flag">Single run</span>' : '';
  let html = '<div class="grid">';
  const parts = (who, own) => eloNote(E, s, who, own);
  if (E) {
    const of = t => ({ e: t, fin: t.fin, rawFin: t.rawFin });
    const rows = E.teams.map((t, j) => ({ ...t, fin: s ? run.elo.team[j] : t.mean, rawFin: s ? (run.elo.team_raw || [])[j] : t.raw && t.raw.mean }));
    const name = { key: 'name', sub: 'Team', v: t => teamName(t.team), cell: t => `<td class="name"><span class="lab">${tLogo(t.team)}<span>${esc(teamName(t.team))}</span><span class="region">${esc(t.team)} &middot; ${esc(region(t.team))}</span></span></td>` };
    const res = s ? [{ key: 'res', grp: 'Final', sub: 'Result', v: t => run.swiss_record[t.team] ? (run.champion === t.team ? 'Champion' : run.swiss_record[t.team]) : 'Play-In', cell: t => `<td>${esc(run.swiss_record[t.team] ? (run.champion === t.team ? 'Champion' : run.swiss_record[t.team]) : 'Play-In')}</td>` }] : [];
    const cols = eloCols(E, s, of, 2, 'Team'), sc = eloSort('team', cols, rows, [name, ...res]);
    html += `<section class="panel wide"><h2>Team Elo${tag}</h2><p class="note">${parts('the team', 'Team')} Every simulated game is fed back into the model as an Oracle's Elixir game, so ratings move as the tournament plays out; teams knocked out early play fewer games and move less.</p>
    ${eloTable('team', cols, rows, [name], res, sc)}</section>`;
  }
  const roles = { all: 'All', top: 'Top', jng: 'Jungle', mid: 'Mid', bot: 'Bot', sup: 'Support' };
  const seg = `<div class="seg" role="group" aria-label="Role">${Object.entries(roles).map(([k, v]) => `<button aria-pressed="${k === roleFilter}" data-role="${k}">${v}</button>`).join('')}</div>`;
  const rows = PS.filter(p => roleFilter === 'all' || p.role === roleFilter).map(p => {
    const t = playerTotals(p.i, 'all'), e = E ? E.players[p.i] : null;
    return { p, t, e, fin: e ? (s ? run.elo.player[p.i] : e.mean) : null, rawFin: e ? (s ? (run.elo.player_raw || [])[p.i] : e.raw && e.raw.mean) : null };
  });
  const name = { key: 'name', sub: 'Player', v: o => o.p.name, cell: ({ p }) => `<td class="name"><span class="lab">${PIX[p.team + '|' + p.role] === p.i ? pPhoto(p.team, ROLE_KEYS.indexOf(p.role)) : subPhoto(p.team, ROLE_KEYS.indexOf(p.role), p.name)}<button class="plink" data-player="${p.i}">${esc(p.name)}</button><span class="region">${esc(roles[p.role])}</span></span></td>` };
  const team = { key: 'team', sub: 'Team', v: o => o.p.team, cell: ({ p }) => `<td class="name"><span class="lab">${tLogo(p.team)}<span>${esc(p.team)}</span></span></td>` };
  const tail = [
    { key: 'games', sub: 'Games', v: o => o.t.games, cell: o => `<td>${num(o.t.games, s ? 0 : 1)}</td>` },
    { key: 'kda3', sub: 'K / D / A', v: o => o.t.kills + o.t.assists, cell: o => `<td>${[o.t.kills, o.t.deaths, o.t.assists].map(x => num(x, s ? 0 : 1)).join(' / ')}</td>` },
    { key: 'kda', sub: 'KDA', v: o => o.t.games ? kdaOf(o.t.kills, o.t.deaths, o.t.assists, !s) : null, cell: o => `<td>${o.t.games ? num(kdaOf(o.t.kills, o.t.deaths, o.t.assists, !s), 2) : '&ndash;'}</td>` },
  ];
  const cols = E ? eloCols(E, s, o => ({ e: o.e, fin: o.fin, rawFin: o.rawFin }), 2, 'Player') : [];
  if (!E) ELO_SORT.player = 'games';
  const gp = s ? 'Final' : 'Predicted';
  if (E) for (const c of tail) c.grp = gp;
  const sc = eloSort('player', [...cols, ...tail], rows, [name, team]);
  html += `<section class="panel wide"><h2>Players${tag}</h2>
  <p class="note">${E ? parts('the player', 'Player') + ' A player\'s Elo is a fifth of the team\'s plus their own, so the five role-by-role gaps of a matchup add up to its Elo gap.' : 'Each player\'s tournament line.'} ${s ? 'Numbers are this simulation\'s.' : 'Games and K/D/A are averages per simulation (0 when a team is already out).'} Click a player's name for their full stats page.</p>${seg}
  ${eloTable('player', cols, rows, [name, team], tail, sc)}</section></div>`;
  return html;
}

function playerView(i) {
  const P = PS[i], s = single(), run = s ? RUN() : null, E = V().elo && (!s || run.elo) ? V().elo.players[i] : null, played = E && V().elo.played;
  const tag = s ? '<span class="single-flag">Single run</span>' : '';
  const roleName = ROLE_NAMES[ROLE_KEYS.indexOf(P.role)], d = s ? 0 : 1;
  const all = playerTotals(i, 'all');
  const fin = E ? (s ? run.elo.player[i] : E.mean) : null;
  // Same Pre-Worlds / Current / Predicted columns as the Elo page's player table, for this one player.
  let eloPanel = '';
  if (E) {
    const o = { e: E, fin, rawFin: s ? (run.elo.player_raw || [])[i] : E.raw && E.raw.mean }, cols = eloCols(V().elo, s, x => x, 2, 'Player');
    eloPanel = `<section class="panel" style="flex:2 1 560px"><h2>Elo${tag}</h2><p class="note">${eloNote(V().elo, s, 'the player', 'Player').replace(' Click a header to sort.', '')}</p>
    <div class="scroll"><table class="one">${sortHead(cols)}<tbody><tr>${cols.map(c => c.cell(o)).join('')}</tr></tbody></table></div></section>`;
  }
  const kpi = (label, value, sub = '') => `<div class="kpi"><span>${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  const pg = (x, g) => g > 0 ? x / g : NaN;
  const kpis = [
    kpi(s ? 'Games' : 'Avg games', num(all.games, d), `${s ? `${all.wins}W ${all.games - all.wins}L` : `win rate ${pct(pg(all.wins, all.games), 0)}`}`),
    kpi('KDA', all.games ? num(kdaOf(all.kills, all.deaths, all.assists, !s), 2) : '&ndash;', `${[all.kills, all.deaths, all.assists].map(x => num(x, d)).join(' / ')}`),
    kpi('Kill participation', pct(pg(all.kills + all.assists, all.team_kills), 0)),
    kpi('CS / game', num(pg(all.cs, all.games), 0)), kpi('Damage / game', all.games ? Math.round(pg(all.damage, all.games)).toLocaleString() : '&ndash;'),
  ].join('');
  // One table row from a totals object `t`; `lab` is the first cell. 
  const trow = (lab, t, cls = '') => {
    const mk = c => t[c] == null ? '&ndash;' : num(t[c], s ? 0 : 2);
    return `<tr${cls}><td class="name">${lab}</td>${s ? '' : `<td>${t.p_played == null ? '&ndash;' : pct(t.p_played, 0)}</td>`}<td>${num(t.games, d)}</td><td>${t.games > 0 ? pct(pg(t.wins, t.games), 0) : '&ndash;'}</td>
      <td>${[t.kills, t.deaths, t.assists].map(x => num(x, d)).join(' / ')}</td><td>${t.games > 0 ? num(kdaOf(t.kills, t.deaths, t.assists, !s), 2) : '&ndash;'}</td>
      <td>${t.games > 0 ? pct(pg(t.kills + t.assists, t.team_kills), 0) : '&ndash;'}</td><td>${t.games > 0 ? num(pg(t.cs, t.games), 0) : '&ndash;'}</td><td>${t.games > 0 ? Math.round(pg(t.damage, t.games)).toLocaleString() : '&ndash;'}</td>
      <td>${mk('firstbloods')}</td><td>${mk('doubles')}</td><td>${mk('triples')}</td><td>${mk('quadras')}</td><td>${mk('pentas')}</td></tr>`;
  };
  const ACTP = st => ((R.actual || {})[st] || { player: {} }).player[`${P.name} (${P.team})`];
  const SUMK = ['games', 'wins', 'kills', 'deaths', 'assists', 'firstbloods', 'doubles', 'triples', 'quadras', 'pentas', 'cs', 'damage', 'team_kills'];
  const stageRows = st => {
    const t = playerTotals(i, st), a = hasPlayed() && (R.actual?.[st]?.games || 0) > 0 ? (ACTP(st) || Object.fromEntries(SUMK.map(k => [k, 0]))) : null;
    if (!a) return trow(STAGE_LABEL[st], t);
    // Games already played (the same in every simulation) vs the rest: this run's, or the average per simulation.
    const rest = Object.fromEntries(SUMK.map(k => [k, Math.max(0, t[k] - a[k])]));
    const sub = x => `<span class="region" style="margin-left:14px">${x}</span>`;
    return trow(`<b>${STAGE_LABEL[st]}</b>`, t) + trow(sub('Played so far'), a) + trow(sub(s ? 'Simulated rest' : 'Predicted rest'), rest);
  };
  const stages = `<section class="panel wide"><h2>Tournament stats${tag}</h2>
  <p class="note">${s ? 'Totals in this simulation. ' : 'Totals are averages per simulation, counting 0 for simulations where the team was already out (Plays = share of simulations the player reaches that stage). Rates (win %, KDA, KP, per game) pool every simulated game.'}${hasPlayed() ? ' Where games have already been played, each stage splits into the real games so far, the rest (simulated) and the total.' : ''}</p>
  <div class="scroll"><table><thead><tr><th>Stage</th>${s ? '' : '<th>Plays</th>'}<th>Games</th><th>Win %</th><th>K / D / A</th><th>KDA</th><th>KP</th><th>CS/g</th><th>Dmg/g</th><th>FB</th><th>Double</th><th>Triple</th><th>Quadra</th><th>Penta</th></tr></thead>
  <tbody>${['all', 'play_in', 'swiss', 'knockout'].filter(st => s ? (runLines()[i] || []).some(l => st === 'all' || l.stage === st) || st === 'all' : PSV()[i].stages[st].p_played > 0 || st === 'all').map(stageRows).join('')}</tbody></table></div></section>`;
  let champs = '';
  const open = LB_OPEN.has('pchamps');
  if (s) {
    const by = {};
    for (const l of runLines()[i] || []) (by[l.champ] ||= []).push(l);
    const rows = Object.entries(by).map(([c, ls]) => [c, totals(ls)]).sort((a, b) => b[1].games - a[1].games);
    champs = `<section class="panel"><h2>Champions</h2><table><thead><tr><th>Champion</th><th>Games</th><th>W-L</th><th>KDA</th></tr></thead><tbody>
      ${rows.slice(0, open ? rows.length : LB_TOP).map(([c, t]) => `<tr><td class="name">${withIcon(c)}</td><td>${t.games}</td><td>${t.wins}-${t.games - t.wins}</td><td>${num(kdaOf(t.kills, t.deaths, t.assists, false), 2)}</td></tr>`).join('') || '<tr><td colspan="4">No games</td></tr>'}</tbody></table>${lbSec('champions')}${lbMore('pchamps', rows.length)}</section>`;
  } else if (PSV()[i].champs) {
    const max = Math.max(...PSV()[i].champs.map(c => c[1])), hp = hasPlayed() && PSV()[i].champs.some(c => c[3] != null);
    champs = `<section class="panel"><h2>Champions</h2><p class="note">Average games per simulation on each champion, and the win rate on it across all simulated games (Actual: the win rate and W-L in real games so far).${hp ? ' The brighter part of each bar is real games already played; the dimmer part is predicted.' : ''}</p>
      <table><thead><tr><th>Champion</th><th>Games / sim</th><th>Win %</th>${hp ? '<th>Actual</th>' : ''}</tr></thead><tbody>
      ${PSV()[i].champs.slice(0, open ? undefined : LB_TOP).map(([c, g, w, pl, pw]) => `<tr><td class="name">${withIcon(c)}</td><td class="cell"><i style="width:${g / max * 100}%"></i>${hp && pl ? `<i class="pl" style="width:${pl / max * 100}%" title="${pl} played, ${num(g - pl, 2)} predicted"></i>` : ''}${num(g, 2)}</td><td>${pct(w, 0)}</td>${hp ? `<td>${pl ? `${pct(pw / pl, 0)} <small>${pw}-${pl - pw}</small>` : '&ndash;'}</td>` : ''}</tr>`).join('')}</tbody></table>${lbSec('champions')}${lbMore('pchamps', PSV()[i].champs.length)}</section>`;
  }
  const log = s ? `<section class="panel wide"><h2>Game log</h2><p class="note">Click a game for its draft and box score.</p><div class="scroll"><table><thead><tr><th>Stage</th><th>Opponent</th><th>Champion</th><th>Result</th><th>K / D / A</th><th>CS</th><th>Gold</th><th>Dmg</th><th>Length</th></tr></thead><tbody>
    ${(runLines()[i] || []).map(l => `<tr><td class="name">${glink(l.e, `${STAGE_LABEL[l.stage]} &middot; ${esc(l.round)} G${l.g}`, l.win ? 'w' : 'l')}</td><td class="name">${teamLab(l.opp)}</td><td class="name">${withIcon(l.champ)}</td>
      <td class="${l.win ? 'res-w' : 'res-l'}">${l.win ? 'Win' : 'Loss'}</td><td>${l.k}/${l.d}/${l.a}</td><td>${l.cs}</td><td>${l.gold == null ? '&ndash;' : (l.gold / 1000).toFixed(1) + 'k'}</td><td>${(l.dmg / 1000).toFixed(1)}k</td><td>${num(l.len, 1)}m</td></tr>`).join('')}
  </tbody></table></div></section>` : '';
  return `<div class="phead"><button class="tool" data-back>&larr; All players</button>${PIX[P.team + '|' + P.role] === P.i ? pPhoto(P.team, ROLE_KEYS.indexOf(P.role), 'lg') : subPhoto(P.team, ROLE_KEYS.indexOf(P.role), P.name, 'lg')}<h2>${esc(P.name)}</h2>
    <span class="region">${esc(teamName(P.team))} &middot; ${esc(region(P.team))} &middot; ${roleName}</span>${tag}</div>
    <div class="kpis" style="margin-bottom:16px">${kpis}</div>
    <div class="grid">${stages}<div class="wide-row" style="grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">${eloPanel}${champs.replace('<section class="panel">', '<section class="panel" style="flex:1 1 280px">')}</div>${log}</div>`;
}

window.addEventListener('hashchange', () => { readHash(); render() });
window.addEventListener('popstate', () => { readHash(); render() });

document.getElementById('view').addEventListener('click', e => {
  const pl = e.target.closest('[data-player]');
  if (pl) { playerSel = +pl.dataset.player; history.pushState(null, '', '#player-' + playerSel); window.scrollTo(0, 0); return render(); }
  if (e.target.closest('[data-back]')) { playerSel = null; history.pushState(null, '', '#elo'); return render(); }
  const rf = e.target.closest('button[data-role]');
  if (rf) { roleFilter = rf.dataset.role; return render(); }
  const cs = e.target.closest('[data-cbsort]');
  if (cs) { const [q, k] = cs.dataset.cbsort.split(':'); CB_SORT[q] = k; return render(); }
  for (const k of ['team', 'player']) { const es = e.target.closest(`[data-elo${k}]`); if (es) { ELO_SORT[k] = es.dataset[`elo${k}`]; return render(); } }
  const ms = e.target.closest('[data-metasort]');
  if (ms) { META_SORT = ms.dataset.metasort; return render(); }
  const le = e.target.closest('[data-lbexpand]');
  if (le) { const k = le.dataset.lbexpand; LB_OPEN.has(k) ? LB_OPEN.delete(k) : LB_OPEN.add(k); return render(); }
  const ce = e.target.closest('[data-cbexpand]');
  if (ce) { const q = +ce.dataset.cbexpand; CB_OPEN.has(q) ? CB_OPEN.delete(q) : CB_OPEN.add(q); return render(); }
  const gl = e.target.closest('[data-sg]');
  if (gl) return openSeries(OPEN[+gl.dataset.sg], +gl.dataset.gn);
  const mc = e.target.closest('.match[data-g]');
  if (mc) return openSeries(OPEN[+mc.dataset.g]);
  const mb = e.target.closest('button[data-mode]');
  if (mb) { mode = mb.dataset.mode; if (mode === 'single' && !runsView()[runIdx]) runIdx = 0; try { localStorage.setItem('pk_mode', mode) } catch (e) {} return render(); }
  const rb = e.target.closest('button[data-run]');
  if (rb) {
    const n = runsView().length, a = rb.dataset.run;
    runIdx = a === 'prev' ? (runIdx - 1 + n) % n : a === 'next' ? (runIdx + 1) % n : Math.floor(Math.random() * n);
    return render();
  }
  const b = e.target.closest('button[data-scope]'); if (!b) return;
  scope = b.dataset.scope; try { localStorage.setItem('pk_scope', scope) } catch (e) {}
  render();
});

document.getElementById('view').addEventListener('change', e => {
  const sel = e.target.closest('select[data-given]'); if (!sel) return;
  given = sel.value; try { localStorage.setItem('pk_given', given) } catch (e) {}
  runIdx = Math.floor(Math.random() * Math.max(runsView().length, 1));
  render();
});

document.getElementById('view').addEventListener('keydown', e => {
  const mc = e.target.closest('.match[data-g]');
  if (mc && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSeries(OPEN[+mc.dataset.g]) }
  const sg = e.target.closest('.pc[data-sg]');
  if (sg && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSeries(OPEN[+sg.dataset.sg], +sg.dataset.gn) }
});

function render() {
  renderTabs();
  OPEN = [];
  const v = document.getElementById('view');
  if (single() && !RUN()) {
    const id = ENTRY().id;
    if (RUNFAIL[id]) {
      v.innerHTML = modeBar() + `<section class="panel"><h2>Can't load simulation #${id + 1}</h2>${location.protocol === 'file:' ? `<p class="note">Single-run mode reads each simulation from <code>${esc(RUN_DIR)}${id}.json</code>, which browsers only allow when the page is served over http, not opened as a file. Start the local server and open <a href="http://localhost:8765/">http://localhost:8765/</a>:</p><pre>python3 -m http.server 8765 --directory dashboard/out</pre>` : '<p class="note">This simulation failed to load. Try reloading the page.</p>'}<p class="note">(${esc(RUNFAIL[id])})</p></section>`;
      return;
    }
    v.innerHTML = modeBar() + `<p class="note">Loading simulation #${id + 1}&hellip;</p>`;
    loadRun(id).then(() => { if (ENTRY().id === id) render() });
    return;
  }
  if (single()) { const n = runsView().length; for (const d of [1, -1]) loadRun(runsView()[(runIdx + d + n) % n].id) }  // prefetch neighbours
  v.innerHTML = modeBar() + (tab === 'pickems' ? pickemsView() : tab === 'bracket' ? bracketView() : tab === 'odds' ? oddsView() : tab === 'swiss' ? swissView() : tab === 'crystal' ? crystalView() : tab === 'elo' ? eloView() : tab === 'likelihood' ? `<div class="grid">${likelihoodPanel()}</div>` : metaView());
}
render();
</script>
</body>
</html>
