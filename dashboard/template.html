<style>
/* Layout: broadcast-style header, tab strip, then dense scan-first panels in a wrapping grid. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #141822; --muted: #5d6676; --line: #dde2ea;
  --accent: #0b7285; --accent-soft: #d6eef2; --gold: #a77b1c; --gold-soft: #f4ead2;
  --good: #2b8a3e; --good-soft: #dcf2e0; --bad: #c92a2a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --surface: #171c25; --ink: #e7eaf0; --muted: #98a2b3; --line: #2a313d;
  --accent: #3bc9db; --accent-soft: #123a42; --gold: #e0b45a; --gold-soft: #3a2f17;
  --good: #69db7c; --good-soft: #17361e; --bad: #ff8787; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171c25; --ink: #e7eaf0; --muted: #98a2b3; --line: #2a313d;
  --accent: #3bc9db; --accent-soft: #123a42; --gold: #e0b45a; --gold-soft: #3a2f17;
  --good: #69db7c; --good-soft: #17361e; --bad: #ff8787; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: start; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 12px }
h1 { font: 700 2.4rem/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase }
h1 span { color: var(--gold) }
h2 { font: 600 1.35rem/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; text-wrap: balance }
h3 { font: 600 1.05rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; color: var(--muted) }
.meta { font: 12px/1.5 var(--mono); color: var(--muted); text-align: right; margin-left: auto; flex: 0 1 620px }
.meta .nw { white-space: nowrap }
.meta b { color: var(--ink); font-weight: 500 }
/* Version picker (live site + daily snapshots, from /versions.json) and the snapshot banner. */
.versions { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 30px; font: 600 .85rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.versions:empty { display: none }
.versions select { font: 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; max-width: 100% }
.snapbar { background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); border-radius: 4px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px }
.snapbar a { color: var(--accent); font-weight: 600 }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin: 16px 0 }
nav button, .seg button, .seg a, .seg [aria-current="page"] { font: 600 1rem var(--display); text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 6px 14px; cursor: pointer; border-radius: 3px }
nav button[aria-selected="true"], .seg button[aria-pressed="true"], .seg [aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#view { min-height: 100vh }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; min-width: 0 }
.panel.wide { grid-column: 1 / -1 }
.note { color: var(--muted); font-size: 13px; max-width: 75ch; margin: 0 0 12px }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th { font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap }
th:first-child, td:first-child { text-align: left }
thead tr + tr th:first-child { text-align: right }  /* sub-header row under group labels: its first cell isn't the table's first column */
table.one th:not(.grp), table.one td { text-align: right; padding-inline: 9px }  /* .one: the player page's single-row Elo table */
th[rowspan] { vertical-align: bottom }
th.grp { text-align: center; border-bottom: 0; padding-bottom: 0 }
th.grp span { display: block; padding-bottom: 3px; border-bottom: 1px solid var(--line); color: var(--ink) }
td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--mono); font-size: 12.5px }
td.name { font-family: var(--body); font-weight: 500; font-size: 13.5px }
tr:last-child td { border-bottom: 0 }
.cell { position: relative; z-index: 0 }
.cell i { position: absolute; inset: 3px auto 3px 0; background: var(--accent-soft); z-index: -1; border-radius: 2px }
.cell.gold i { background: var(--gold-soft) }
.cell i.pl { background: var(--accent); opacity: .55 }  /* the played share of a stacked bar */
.pill { display: inline-block; font: 500 11px var(--mono); padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px }
.region { font: 500 11px var(--mono); color: var(--muted); margin-left: 6px }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 14px }
.bucket { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0 }
.bucket h3 { margin-bottom: 6px }
.bucket ol { margin: 0; padding: 0; list-style: none; font-weight: 600 }
/* One pick per row: rank, team, record (or chance), verdict -- columns line up across rows. */
.bucket li { display: grid; grid-template-columns: 1.3em minmax(0, 1fr) auto 5.6em; align-items: center; gap: 8px; padding: 3px 0 }
.bucket li .n { font: 500 12px var(--mono); color: var(--muted) }
.bucket li .lab > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bucket li .rec { font: 400 12px var(--mono); color: var(--muted); text-align: right }
.bucket li .tag { font: 500 12px var(--mono); white-space: nowrap }
.big { font: 700 2rem/1 var(--display); color: var(--gold) }
.seg { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px }
.leader td.p { width: 38% }
/* Champion boards carry Actual/Predicted columns; let headers wrap so cards don't overflow. */
.leader th { white-space: normal; vertical-align: bottom }
/* Boards run to 7 columns (and long names / K / D / A once expanded): wider cards, tighter cells,
   names wrap, and anything left scrolls inside the card on phones. */
.grid.lb { grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)) }
.leader th, .leader td { padding-left: 4px; padding-right: 4px }
.leader th { letter-spacing: .02em }
.leader td.name { white-space: normal }
.leader td.name, .leader th:nth-child(2) { text-align: left }
.dist { display: flex; align-items: end; gap: 2px; height: 70px; margin: 6px 0 2px }
.dist div { flex: 1; background: var(--accent); opacity: .75; min-height: 1px; border-radius: 1px 1px 0 0 }
.distlab { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted) }
.stat { display: flex; justify-content: space-between; gap: 8px; font: 12.5px var(--mono) }
.stat b { font-weight: 500 }
.qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px }
.qn { font: 600 .9rem var(--display); color: var(--muted); letter-spacing: .08em }
.q { margin: 0 0 8px; font-weight: 500; text-wrap: balance }
.ans { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap }
.ans .big { font-size: 1.6rem }
.ans { align-items: center } .emote { width: 56px; height: 56px; object-fit: contain; margin: -6px 0 }
.ansp { font: 500 14px var(--mono); color: var(--accent) }
.up { color: var(--good) } .down { color: var(--bad) }
.modebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: -4px 0 16px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px }
.modebar .seg { margin: 0 }
.seg a { text-decoration: none }
.buffseg { align-items: center }
.buffseg > span:first-child { font: 600 .9rem var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-right: 2px }
.modebar .runinfo { font: 12.5px var(--mono); color: var(--muted) }
.modebar .runinfo b { color: var(--ink); font-weight: 500 }
.tool { font: 600 .95rem var(--display); text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 5px 12px; cursor: pointer; border-radius: 3px }
.tool:hover { border-color: var(--accent) }
.single-flag { display: inline-block; font: 600 .8rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 0 6px; margin-left: 8px; vertical-align: middle }
/* Brackets: columns of match cards, vertically centered so later rounds sit between their feeders. */
.bracket { display: grid; gap: 10px 28px; align-items: center; min-width: 640px }
.bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; height: 100% }
.bhead { font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px }
.match { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); overflow: hidden; position: relative; min-width: 0 }
.match .slot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 9px; font-size: 13px; border-left: 3px solid transparent }
.match .slot + .slot { border-top: 1px solid var(--line) }
.match .slot.win { font-weight: 600; border-left-color: var(--accent); background: var(--accent-soft) }
.match .slot.win.gold { border-left-color: var(--gold); background: var(--gold-soft) }
.match .slot > span:last-child { font: 12px var(--mono); color: var(--muted) }
.match .slot.win > span:last-child { color: var(--ink) }
/* Series already played: a result, not a prediction. Green winner with a check instead of a pick percentage. */
.match.done { border-color: var(--good) }
.match.done .slot.win, .match.done .slot.win.gold { border-left-color: var(--good); background: var(--good-soft) }
.match.done .slot > span:last-child { color: var(--ink) }
.match.done .slot.win > span:last-child { color: var(--good); font-weight: 600 }
.match .mlabel { font: 600 .72rem var(--display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 3px 9px 0 }
.pi-grid { grid-template-columns: repeat(4, minmax(150px, 1fr)); grid-template-areas: "ubs ubf . q" "ubs2 lbs lbf q" }
.ko-grid { grid-template-columns: repeat(3, minmax(170px, 1fr)) }
.bwrap { display: flex; flex-direction: column; height: 100% }
.bwrap .bcol { flex: 1 }
.ko-grid { align-items: stretch }
.ko-grid .bcol { min-height: 400px }
.swiss-grid { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 14px; min-width: 780px }
.swiss-grid .bcol { justify-content: flex-start; gap: 8px }
.match .slot.v-ok { font-weight: 600; border-left-color: var(--good); background: var(--good-soft) }
.match .slot.v-part { font-weight: 600; border-left-color: var(--gold); background: var(--gold-soft) }
.match .slot.v-bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent) }
.match .slot[class*="v-"] > span:last-child { color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.swiss-cards .slot .lab { min-width: 0 }
.swiss-cards .slot .lab > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.vi { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font: 800 11px/1 system-ui, sans-serif; color: var(--bg); flex: none }
.vi.ok { background: var(--good) } .vi.part { background: var(--gold) } .vi.bad { background: var(--bad) }
.vlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin: -4px 0 10px }
.vlegend > span { display: inline-flex; align-items: center; gap: 6px }
.sgrid { display: grid; grid-template-columns: minmax(150px, 210px) repeat(var(--nr), minmax(92px, 1fr)) 56px; gap: 4px 6px; min-width: 720px; align-items: center }
.sgrid .ph { font: 600 .74rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; padding-bottom: 4px; border-bottom: 1px solid var(--line) }
.sgrid .ph:first-child { text-align: left }
.sgrid .gap { grid-column: 1 / -1; height: 6px }
.sgrid .tm { font-size: 13px; font-weight: 600; min-width: 0 }
.sgrid .tm .lab > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sgrid .pc { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 4px; border-left: 3px solid; font: 600 12px var(--mono); background: var(--bg) }
.sgrid .pc .s { font-weight: 400; color: var(--muted) }
.sgrid .pc .r { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted) }
/* predictions, like the Play-In pick cards: favourite in accent, underdog plain */
.sgrid .pc.pred { border-left-color: transparent; color: var(--muted) }
.sgrid .pc.pred b { font-weight: 400 }
.sgrid .pc.pred.fav { border-left-color: var(--accent); background: var(--accent-soft); color: var(--ink) }
.sgrid .pc.pred.fav b { font-weight: 700 }
.sgrid .pc.w { border-left-color: var(--good); background: var(--good-soft) }
.sgrid .pc.w b { color: var(--good) }
.sgrid .pc.l { border-left-color: var(--bad); color: var(--muted) }
.sgrid .pc.l b { color: var(--bad) }
.sgrid .pc[data-sg] { cursor: pointer }
.sgrid .pc[data-sg]:hover { outline: 1px solid var(--accent) }
.sgrid .pc.tbd { border: 1px dashed var(--line); background: none; justify-content: center; color: var(--muted); font-weight: 400; opacity: .6 }
.sgrid .rec { font: 700 13px var(--mono); text-align: center }
.sgrid .rec.w { color: var(--good) } .sgrid .rec.l { color: var(--bad) }
.swiss-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; align-items: start }
.swiss-cards.mu { margin-bottom: 10px }
td.cell.hitrec { outline: 2px solid var(--good); outline-offset: -2px }
.recgrid { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 10px; min-width: 700px }
.recgrid .bucket { padding: 8px 10px }
.recgrid .bucket div { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 13px; padding: 2px 0 }
.recgrid .bucket div > span:last-child:not(.lab) { font: 12px var(--mono); color: var(--muted) }
.outcome { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font: 12.5px var(--mono); color: var(--muted); margin-top: 6px }
.match-ok { color: var(--good) } .match-no { color: var(--bad) }
/* Single-run series detail: clickable cards open a dialog with each game's draft and box score. */
.match[data-g] { cursor: pointer }
.match[data-g]:hover, .match[data-g]:focus-visible { border-color: var(--accent); outline: none }
.match .more { font: 500 11px var(--mono); color: var(--accent); padding: 2px 9px 4px; text-align: right }
dialog.series { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); padding: 0 }
dialog.series::backdrop { background: rgb(0 0 0 / .45) }
.dhead { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line) }
.dhead h2 { margin: 0 }
.dbody { padding: 12px 16px 18px }
.game { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-top: 12px }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px }
.ghead h3 { margin: 0; font: 600 1.1rem var(--display); text-transform: uppercase; letter-spacing: .04em }
.ghead span { font: 12.5px var(--mono); color: var(--muted) }
.ghead b { color: var(--ink); font-weight: 500 }
.draft { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px }
.draft span { font: 500 11.5px var(--mono); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--line) }
.draft span.B { border-color: #4c8bf5; color: #4c8bf5 }
.draft span.R { border-color: #e8590c; color: #e8590c }
.draft span.ban { text-decoration: line-through; opacity: .65 }
.draft span.p.B { background: rgb(76 139 245 / .12) } .draft span.p.R { background: rgb(232 89 12 / .12) }
.draft i { font-style: normal; color: var(--muted); font: 11px var(--mono); align-self: center; margin: 0 2px }
.box { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 10px }
.box > div { overflow-x: auto }
.box th.side { text-align: left }
.box .B th.side { color: #4c8bf5 } .box .R th.side { color: #e8590c }
.wtag { font: 600 .75rem var(--display); letter-spacing: .08em; color: var(--good); margin-left: 6px }
/* Elo & player pages. */
.plink { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; text-align: left }
.plink:hover { color: var(--accent); text-decoration-color: var(--accent) }
.phead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px }
.phead h2 { margin: 0; font-size: 2rem }
.phead .region { font-size: 13px }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.kpi { border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; min-width: 0 }
.kpi span { display: block; font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.kpi b { font: 700 1.6rem/1.2 var(--display) }
.kpi small { display: block; font: 12px var(--mono); color: var(--muted) }
td.res-w { color: var(--good) } td.res-l { color: var(--bad) }
/* Icons: champion squares, team logos, player photos (fall back to initials). */
.ci, .tl, .pp { display: inline-block; vertical-align: middle; flex: none; object-fit: cover }
.ci { width: 22px; height: 22px; border-radius: 3px }
.tl { width: 20px; height: 20px; object-fit: contain; background: #f4f5f7; border-radius: 4px; padding: 2px }  /* light tile so dark logos read on the dark theme */
.pp { width: 24px; height: 24px; border-radius: 50%; object-position: top; background: var(--line) }
.ci.txt, .tl.txt, .pp.txt { display: inline-grid; place-items: center; font: 600 9px var(--mono); color: var(--muted); background: var(--line); border-radius: 3px }
.pp.txt { border-radius: 50% }
.ci.lg { width: 36px; height: 36px } .tl.lg { width: 34px; height: 34px } .pp.lg { width: 44px; height: 44px }
.ci.sm { width: 18px; height: 18px }
.lab { display: inline-flex; align-items: center; gap: 6px; min-width: 0 }
.given { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font: 600 .9rem var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
.given select { font: 13px var(--body); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; max-width: 100% }
.given-banner { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 6px 10px; border-radius: 0 4px 4px 0; margin: 0 0 14px; font-size: 13px }
/* Crystal Ball detail. */
.cbx { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px }
.cbx h4 { font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 4px }
.cbx table td { font-size: 12px }
.grid.cb { grid-template-columns: repeat(auto-fill, minmax(min(540px, 100%), 1fr)) }
.cbt th, .cbt td { padding-inline: 4px }
.cbt.open { max-height: 540px; overflow-y: auto }
.cbt thead { position: sticky; top: 0; z-index: 1; background: var(--surface) }
.cbt td.act { color: var(--ink); font-weight: 500 }
.cbt td.cell { padding-left: 12px }
.cbt td.cell i { left: 8px; max-width: calc(100% - 8px) }
.sorth { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; cursor: pointer }
.sorth:hover, .sorth.on { color: var(--ink) }
.expand { margin-top: 6px; font: 500 11.5px var(--mono); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; cursor: pointer }
.srow { cursor: pointer }
.srow:hover td { background: var(--accent-soft) }

.fold > summary::before, .fold > summary .qhead::before { content: "\25B8"; display: inline-block; width: 1em; color: var(--accent); font-size: 1.1rem }
.fold[open] > summary::before, .fold[open] > summary .qhead::before { content: "\25BE" } .fold > summary:has(.qhead)::before { content: none }

.rg span { display: block; font: 600 .9rem var(--display); letter-spacing: .05em }
.rg b { font: 500 13px var(--mono) }

.dist div.hit { background: var(--gold); opacity: .9 }
.prog { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 4px 0 }
.prog i { display: block; height: 100%; background: var(--accent) }
.prog.done i { background: var(--good) }
.vs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.vs2 > div { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0 }
.vs2 .lab { font-weight: 600 }
.answer-p { font: 500 12.5px var(--mono); color: var(--muted) }
.answer-p b { color: var(--ink); font-weight: 600 }
/* Game breakdown (series dialog). */
.gbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: linear-gradient(90deg, rgb(76 139 245 / .16), transparent 40% 60%, rgb(232 89 12 / .16)); border-radius: 4px; padding: 8px 12px; margin-bottom: 10px }
.gbar .t { display: flex; align-items: center; gap: 10px; font: 700 1.3rem var(--display); text-transform: uppercase; min-width: 0 }
.gbar .t.r { justify-content: flex-end; text-align: right }
.gbar .res { font: 600 .85rem var(--display); letter-spacing: .1em; padding: 1px 6px; border-radius: 3px }
.gbar .res.w { color: var(--good); border: 1px solid var(--good) } .gbar .res.l { color: var(--muted); border: 1px solid var(--line) }
.gbar .mid { text-align: center; font: 12px var(--mono); color: var(--muted) }
.gbar .mid b { display: block; font: 700 1.6rem/1 var(--display); color: var(--ink) }
.gwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 14px }
@media (max-width: 760px) { .gwrap { grid-template-columns: 1fr } }
@media (max-width: 560px) { .gbar { padding: 6px 8px; gap: 6px } .gbar .t { font-size: 1rem; gap: 6px } .gbar .t > span:not(.res) { display: none } .dmg { grid-template-columns: 1fr } .dmg .head.R { text-align: left } }
.tstats { width: 100% } .tstats td { text-align: center; font-size: 13px; padding: 3px 4px } .tstats td.k { font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.tstats td.b { color: #4c8bf5; font-weight: 600 } .tstats td.r { color: #e8590c; font-weight: 600 } .tstats td.lead { text-decoration: underline 2px; text-underline-offset: 3px }
.wp { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 2px 0 8px } .wp i:first-child { background: #4c8bf5 } .wp i:last-child { background: #e8590c }
.dmg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 10px; align-items: center }
.dmg .row { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px }
.dmg .row.R { flex-direction: row-reverse; text-align: right }

.dmg .who b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.dmg .who small { font: 11px var(--mono); color: var(--muted) }
.dmg .barcol { flex: 1; min-width: 40px; display: flex; flex-direction: column; gap: 1px }
.dmg .row.R .barcol { align-items: flex-end }

.dmg .row.R .barcol i { background: #e8590c }
.dmg .barcol span { font: 11px var(--mono); color: var(--muted) }
.dmg .head { font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.dmg .head.R { text-align: right }
.drow { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-bottom: 6px }

.drow .p.B .ci, .drow .p.B.ci { border-color: #4c8bf5 } .drow .p.R .ci, .drow .p.R.ci { border-color: #e8590c }
.drow .ban { position: relative; display: inline-block }

.drow .ban::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top right, transparent 45%, var(--bad) 47% 53%, transparent 55%) }
.drow .ban.B .ci { border-bottom-color: #4c8bf5 } .drow .ban.R .ci { border-bottom-color: #e8590c }
.drow i { font-style: normal; color: var(--muted); font: 11px var(--mono); margin: 0 3px }
.game { scroll-margin-top: 64px }

@media (prefers-reduced-motion: no-preference) { .cell i { transition: width .3s ease } }

<body>
<div class="wrap">
  <div class="snapbar" id="snapbar" hidden></div>
  <header>
    <div style="flex:1 1 320px">
      <h1>Worlds 2026 <span>Pick'Em Lab</span></h1>
      <div class="note" style="margin:6px 0 0">Monte Carlo of every game: procedural drafts on patch 26.20, draftpredict win odds, simulated box scores.</div>
      <div class="versions" id="versions"></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<script id="report" type="application/json">__REPORT__</script>
<script>
const R = JSON.parse(document.getElementById('report').textContent);
const pct = (x, d = 1) => x == null || isNaN(x) ? '&ndash;' : (x * 100).toFixed(d) + '%';
const num = (x, d = 1) => x == null || isNaN(x) ? '&ndash;' : Number(x).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const teamName = c => (R.meta.teams[c] || {}).name || c;
const region = c => (R.meta.teams[c] || {}).region || '';
const bar = (x, max = 1, cls = '') => `<td class="cell ${cls}"><i style="width:${Math.max(0, Math.min(1, x / (max || 1))) * 100}%"></i>${pct(x)}</td>`;
// Sorts rows by column `sc` (highest first, text A-Z, blanks last), breaking ties with each
// column of `then` in turn the same way, so equal values never land in arbitrary order.
function sortRows(rows, sc, then) {
  const chain = [sc, ...then.filter(c => c && c !== sc)];
  return rows.sort((a, b) => {
    for (const c of chain) { const va = c.v(a), vb = c.v(b);
      if (va == null || vb == null) { const d = (va == null) - (vb == null); if (d) return d; continue }
      const d = typeof va === 'string' ? va.localeCompare(vb) : vb - va; if (d) return d }
    return 0 });
}
// Sortable two-level header: columns sharing `grp` sit under one section label; a column
// without one spans both rows. Each header is a button carrying `${attr}=key` (plain text when no attr).
function sortHead(cols, key, attr) {
  const segs = [];
  for (const c of cols) { const last = segs[segs.length - 1]; if (c.grp && last && last.grp === c.grp) last.cols.push(c); else segs.push({ grp: c.grp, cols: [c] }) }
  const two = segs.some(s => s.grp);
  const th = (c, rs) => { const on = c.key === key;
    return `<th${rs ? ' rowspan="2"' : ''}>${attr ? `<button class="sorth${on ? ' on' : ''}" ${attr}="${c.key}">${c.sub}${on ? ' &#9662;' : ''}</button>` : c.sub}</th>` };
  return `<thead><tr>${segs.map(s => s.grp ? `<th class="grp" colspan="${s.cols.length}"><span>${s.grp}</span></th>` : th(s.cols[0], two)).join('')}</tr>
    ${two ? `<tr>${segs.filter(s => s.grp).map(s => s.cols.map(c => th(c)).join('')).join('')}</tr>` : ''}</thead>`;
}

// Images (pickems/images.py): champion icons, team logos, player photos. Missing or broken
// images fall back to initials, so the page still works offline. Leaguepedia's CDN refuses
// requests with a foreign Referer, hence no-referrer.
const IMG = R.images || {};
const normC = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const initials = s => esc(String(s).replace(/[^A-Za-z0-9 ]/g, '').split(' ').map(w => w[0] || '').join('').slice(0, 2) || '?');
const imgTag = (url, alt, cls) => url
  ? `<img class="${cls}" src="${esc(url)}" alt="" title="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;${cls} txt&quot;>${initials(alt).replace(/'/g, '')}</span>'">`
  : `<span class="${cls} txt" title="${esc(alt)}">${initials(alt)}</span>`;
const champUrl = c => { const C = IMG.champions, id = C && C.ids[normC(c)]; return id ? C.base + id + '.png' : null };
const cIcon = (c, cls = '') => imgTag(champUrl(c), c, 'ci ' + cls);
const tLogo = (t, cls = '') => imgTag((IMG.teams || {})[t], teamName(t), 'tl ' + cls);
const pPhoto = (t, r, cls = '') => imgTag((IMG.players || {})[t + '|' + r], player(t, r), 'pp ' + cls);
// A non-starter's photo (keyed team|role index|name, see pickems/images.py), else initials.
const subPhoto = (t, r, name, cls = '') => imgTag((IMG.players || {})[`${t}|${r}|${name}`], name, 'pp ' + cls);
const TEAM_BY_NAME = Object.fromEntries(Object.entries(R.meta.teams).map(([c, t]) => [t.name, c]));
// Icon for a Crystal Ball / leaderboard label: a champion, "Player (TEAM)", a team code or team name.
function labelIcon(label) {
  if (champUrl(label)) return cIcon(label);
  const m = /^(.+) \(([^)]+)\)$/.exec(label);
  if (m && R.meta.teams[m[2]]) {
    const r = (R.meta.teams[m[2]].players || []).indexOf(m[1]); if (r >= 0) return pPhoto(m[2], r);
    const sub = Object.keys(IMG.players || {}).find(k => k.startsWith(m[2] + '|') && k.endsWith('|' + m[1]) && k.split('|').length === 3);
    if (sub) return subPhoto(m[2], +sub.split('|')[1], m[1]);
  }
  const t = R.meta.teams[label] ? label : TEAM_BY_NAME[label];
  if (t) return tLogo(t);
  for (const [c, T] of Object.entries(R.meta.teams)) { const r = (T.players || []).indexOf(label); if (r >= 0) return pPhoto(c, r) }
  return '';
}
// Teemo question (Q9): a happy or a sad Teemo next to the answer.
const teemoEmote = ans => (IMG.emotes || {})['teemo_' + (ans === 'Yes' ? 'yes' : 'no')] ? imgTag(IMG.emotes['teemo_' + (ans === 'Yes' ? 'yes' : 'no')], ans === 'Yes' ? 'Happy Teemo' : 'Sad Teemo', 'emote') : '';
const withIcon = label => `<span class="lab">${labelIcon(label)}<span>${esc(label)}</span></span>`;
const teamLab = t => `<span class="lab">${tLogo(t)}<span>${esc(teamName(t))}</span></span>`;

// Timestamps shown in the viewer's own time zone. Oracle's Elixir dates (data_through, latest_game)
// are UTC without an offset, which Date would otherwise read as local time.
const utc = s => new Date(/(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s + 'Z');
const localTime = s => utc(s).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const m = R.meta.model || {};
const lg = R.meta.latest_game;
document.getElementById('meta').innerHTML =
  `<b>${R.meta.sims.toLocaleString()}</b> simulated tournaments<br>` +
  `run ${esc(localTime(R.meta.run_at))}<br>` +
  `draftpredict ${esc((m.commit || '').slice(0, 7))}${m.dirty ? ' (uncommitted edits)' : ''} &middot; params v${esc(m.params_version ?? '?')}` +
  (R.meta.worlds_weight ? `<br>Worlds-weighted training (w = ${esc(R.meta.worlds_weight)}${R.meta.worlds_share != null ? `, Worlds ≈ ${(R.meta.worlds_share * 100).toFixed(1)}% of training weight` : ''})` : '') +
  (R.meta.tuned_params ? ` &middot; Worlds-retuned params v${esc(R.meta.tuned_params.version)} (CV ${esc(R.meta.tuned_params.best_value)})` : '') +
  (R.meta.data_through ? `<br>training data through ${esc(localTime(R.meta.data_through))}` : '') +
  (lg ? `<br><span class="nw">latest Worlds game: ${esc(localTime(lg.date))} &middot; ` +
        `<b>${esc(lg.blue)}</b> vs <b>${esc(lg.red)}</b> (G${esc(lg.game)}, ${esc(lg.blue_win ? lg.blue : lg.red)} won)</span>` : '');

// Versions: the live forecast plus a frozen snapshot from before each day's games, each on its
// own host (scripts/deploy.sh --snapshot). The deploy stamps where the list lives and, on a
// snapshot, its label into <meta>; pages without the stamp (local renders) show neither.
const metaContent = n => (document.querySelector(`meta[name="${n}"]`) || {}).content || '';
const SNAPSHOT = metaContent('pickems-snapshot');
// Same host when on the live site or its /v/<label>/ proxy (custom domain or pages.dev alike).
const VERSIONS_URL = metaContent('pickems-versions') && (!SNAPSHOT || location.pathname.startsWith('/v/'))
  ? new URL('/versions.json', location.href).href : metaContent('pickems-versions');
const dayLabel = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const snapName = s => s.title || (s.before ? `Before ${dayLabel(s.before)} games` : s.label);
const snapBar = name => {
  const bar = document.getElementById('snapbar'), home = new URL('/', VERSIONS_URL).href;
  bar.innerHTML = `Archived forecast: <b>${esc(name)}</b>. Frozen, so later results are not in it. <a href="${esc(home)}" onclick="this.href += location.hash">See the latest forecast &rarr;</a>`;
  bar.hidden = false;
};
if (SNAPSHOT && VERSIONS_URL) {
  const day = /^pre-(\d{4}-\d\d-\d\d)$/.exec(SNAPSHOT);
  snapBar(day ? `before the ${dayLabel(day[1])} games` : SNAPSHOT);
}
if (VERSIONS_URL) fetch(VERSIONS_URL, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(v => {
  if (!v || !(v.snapshots || []).length) return;
  const abs = u => new URL(u, VERSIONS_URL).href, me = v.snapshots.find(s => s.label === SNAPSHOT);
  if (me && me.title) snapBar(me.title);
  const opts = [[abs(v.latest), 'Latest forecast', !SNAPSHOT], ...v.snapshots.map(s => [abs(s.url), snapName(s) + (s.run_at ? ` (run ${localTime(s.run_at)})` : ''), s.label === SNAPSHOT])];
  const box = document.getElementById('versions');
  box.innerHTML = `<label for="versel">Forecast</label><select id="versel">${opts.map(([u, t, sel]) => `<option value="${esc(u)}"${sel ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  box.querySelector('select').onchange = e => { location.href = e.target.value + location.hash };  // same tab in the other version
}).catch(() => {});

const TABS = R.pickems
  ? { pickems: 'Your Pick\'Ems', bracket: 'Bracket', odds: 'Title odds', crystal: 'Stat leaders', elo: 'Elo & players', meta: '26.20 meta' }
  : { odds: 'Title odds', swiss: 'Swiss Pick\'Em', crystal: 'Stat leaders', elo: 'Elo & players', meta: '26.20 meta' };
const PS = R.player_stats || [];
if (!PS.length) delete TABS.elo;
if (R.likelihood) TABS.likelihood = 'Result likelihood';
let tab = Object.keys(TABS)[0], scope = 'all';
let playerSel = null, roleFilter = 'all';
let mode = 'likely', runIdx = 0;
// Single-run mode: the page lists every simulation (R.run_index) and fetches each one's data
// from runs/<run name>/<id>.json the first time it's shown (needs the page served over http).
const RUNS = (R.run_index || []).map(([id, champion]) => ({ id, champion }));
const RUN_NAME = R.meta.run_name || '';
// Under /runs/ with or without .html: some hosts (Cloudflare Pages) redirect runs/<name>.html to runs/<name>.
const RUN_DIR = location.pathname.includes('/runs/') ? RUN_NAME + '/' : 'runs/' + RUN_NAME + '/';
const RUNDATA = {}, RUNFAIL = {};
function loadRun(id) {
  if (RUNDATA[id] || RUNFAIL[id]) return Promise.resolve();
  return RUNDATA['p' + id] ||= fetch(RUN_DIR + id + '.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json() })
    .then(d => { RUNDATA[id] = d }, e => { RUNFAIL[id] = String(e) });
}
// "Given champion": every aggregate switches to the simulations that team wins (R.given[team]),
// and single-run mode browses only those runs.
const GIVEN = R.given || {};
let given = '';
try { given = localStorage.getItem('pk_given') || '' } catch (e) {}
if (!GIVEN[given]) given = '';
const V = () => (given && GIVEN[given]) || R;
const PSV = () => V().player_stats || PS;
const runsView = () => given ? RUNS.filter(r => r.champion === given) : RUNS;
const single = () => mode === 'single' && runsView().length > 0;
const ENTRY = () => runsView()[runIdx] || runsView()[0];
const RUN = () => RUNDATA[ENTRY().id];
try { const t = localStorage.getItem('pk_tab'); if (t in TABS) tab = t; scope = localStorage.getItem('pk_scope') || scope } catch (e) {}
function readHash() {
  const h = location.hash.slice(1), pm = /^player-(\d+)$/.exec(h);
  if (pm && PS[+pm[1]]) { tab = 'elo'; playerSel = +pm[1] }
  else if (h in TABS) { tab = h; playerSel = null }
}
readHash();
try { mode = localStorage.getItem('pk_mode') || mode } catch (e) {}
if (runsView().length) runIdx = Math.floor(Math.random() * runsView().length);

const SMALL_GIVEN = 30;
function givenSelect() {
  const teams = Object.keys(GIVEN);
  if (!teams.length) return '';
  const opts = [['', 'Any champion'], ...teams.map(t => [t, `${teamName(t)} wins (${pct(GIVEN[t].n / R.meta.sims, 1)} · ${GIVEN[t].n.toLocaleString()} sim${GIVEN[t].n > 1 ? 's' : ''})`])];
  return `<label class="given">${given ? tLogo(given) : ''}<span>Given</span><select data-given aria-label="Condition on tournament winner">${opts.map(([v, l]) =>
    `<option value="${v}"${v === given ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
}

// Worlds buff toggle: the same event simulated with the buff on and off is two
// runs, each rendered to runs/<run name>.html (the main one also to index.html);
// R.meta.pair names the other. Tab, mode and filter persist in localStorage.
function buffToggle() {
  const pair = R.meta.pair;
  if (!pair) return '';
  const scale = R.meta.worlds_buff_scale || 0, on = scale > 0;
  const href = (location.pathname.includes('/runs/') ? '' : 'runs/') + encodeURIComponent(pair) + '.html' + location.hash;
  const tip = 'Teams that beat or missed their odds at past Worlds get a win-probability shift' + (on ? ` (${Math.round(scale * 100)}% of the estimate)` : '');
  const opt = (isOn, label) => isOn === on ? `<span aria-current="page">${label}</span>` : `<a href="${href}">${label}</a>`;
  return `<div class="seg buffseg" role="group" aria-label="Worlds buff" title="${esc(tip)}"><span>Worlds buff</span>${opt(true, 'On')}${opt(false, 'Off')}</div>`;
}

function modeBar() {
  const runs = runsView(), hasRuns = runs.length > 0;
  const sims = given ? GIVEN[given].n : R.meta.sims, base = given ? `the ${sims.toLocaleString()} simulations ${esc(teamName(given))} wins` : `all ${sims.toLocaleString()} simulations`;
  const run = hasRuns ? ENTRY() : null;
  return `<div class="modebar">${hasRuns ? `<div class="seg" role="group" aria-label="Mode">
    <button aria-pressed="${mode === 'likely'}" data-mode="likely">Most likely</button>
    <button aria-pressed="${mode === 'single'}" data-mode="single">Single run</button></div>` : ''}
    ${hasRuns && mode === 'single' ? `<button class="tool" data-run="prev" aria-label="Previous run">&larr;</button>
      <button class="tool" data-run="roll">Roll random run</button>
      <button class="tool" data-run="next" aria-label="Next run">&rarr;</button>

}

// A match card. rows: [{team, label, win, gold}]
// In single-run mode, a series with a game log is clickable (data-g indexes OPEN).
let OPEN = [];
function matchCard(title, rows) {
  const m = rows.series, g = m && m.games ? OPEN.push(m) - 1 : -1;
  return `<div class="match${rows.done ? ' done' : ''}"${g >= 0 ? ` data-g="${g}" tabindex="0" role="button" aria-label="Show games: ${esc(teamName(m.a))} vs ${esc(teamName(m.b))}"` : ''}>${title ? `<div class="mlabel">${esc(title)}</div>` : ''}${rows.map(r =>
    `<div class="slot ${r.win ? 'win' : ''} ${r.gold ? 'gold' : ''} ${r.cls || ''}"><span class="lab">${r.team ? tLogo(r.team) : ''}<span>${esc(r.team ? teamName(r.team) : 'TBD')}</span></span><span>${r.label ?? ''}</span></div>`).join('')}${g >= 0 ? '<div class="more">games &amp; drafts &rsaquo;</div>' : ''}</div>`;
}
// Series already played, by bracket slot (report.played_slots): results, not predictions.
const playedSeries = (stage, round, a, b) => (R.played_series || []).find(x => x.stage === stage && x.round === round && [x.a, x.b].sort().join() === [a, b].sort().join());
const CHECK = '<span aria-label="played">&#10003;</span> ';
const seriesRows = (m, gold) => { const done = !!(m.games && m.games.length && m.games.every(g => g.p_blue == null)), ck = t => done && m.winner === t ? CHECK : '';
  return Object.assign([{ team: m.a, label: ck(m.a) + m.wa, win: m.winner === m.a, gold }, { team: m.b, label: ck(m.b) + m.wb, win: m.winner === m.b, gold }], { series: m, done }) };

const CH = i => (R.champs || [])[i] ?? '?';
const ROLE_NAMES = ['Top', 'Jungle', 'Mid', 'Bot', 'Support'];
const player = (t, i) => ((R.meta.teams[t] || {}).players || [])[i] || ROLE_NAMES[i];
const OBJ = ['Towers', 'Dragons', 'Barons', 'Void grubs', 'Heralds', 'Atakhan', 'Elders', 'Inhibitors'];  // GAME_OBJ order in summary.py
const k1 = x => (x / 1000).toFixed(1) + 'K';
const mmss = m => { const t = Math.round(m * 60); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') };
// One game, broadcast post-game style: result bar, team stat comparison, draft with icons,
// then each lane's players face to face with damage bars on one scale.
function gameDetail(g, label, focus) {
  const bw = g.blue_win, sum = (L, j) => L.reduce((s, l) => s + (l[j] || 0), 0);
  const gold = [sum(g.bp, 5), sum(g.rp, 5)], hasGold = g.bp[0].length > 5;
  const team = (t, s, won) => `<div class="t ${s === 'R' ? 'r' : ''}">${s === 'R' ? `<span class="res ${won ? 'w' : 'l'}">${won ? 'WIN' : 'LOSS'}</span><span>${esc(teamName(t))}</span>${tLogo(t, 'lg')}` : `${tLogo(t, 'lg')}<span>${esc(teamName(t))}</span><span class="res ${won ? 'w' : 'l'}">${won ? 'WIN' : 'LOSS'}</span>`}</div>`;
  const bar = `<div class="gbar">${team(g.blue, 'B', bw)}<div class="mid">${esc(label)} ${g.g}<b>${mmss(g.len)}</b>blue &middot; red</div>${team(g.red, 'R', !bw)}</div>`;
  const rows = [['Kills', g.bk, g.rk], ...(hasGold ? [['Gold', gold[0], gold[1], k1]] : []), ...(g.bo ? OBJ.map((k, j) => [k, g.bo[j], g.ro[j]]).filter(r => r[1] + r[2] > 0 || ['Towers', 'Dragons', 'Barons'].includes(r[0])) : []),
    ...(g.fb ? [['First blood', g.fb === 'B' ? '&#9679;' : '', g.fb === 'R' ? '&#9679;' : '']] : [])];
  const tstats = `<table class="tstats"><tbody>${rows.map(([k, b, r, f]) => `<tr><td class="b ${typeof b === 'number' && b > r ? 'lead' : ''}">${f ? f(b) : b}</td><td class="k">${k}</td><td class="r ${typeof r === 'number' && r > b ? 'lead' : ''}">${f ? f(r) : r}</td></tr>`).join('')}</tbody></table>
    ${g.p_blue == null ? '<p class="note" style="margin:8px 0 2px">Played: the real game, from Oracle&rsquo;s Elixir</p>' : `<div class="note" style="margin:8px 0 2px">Pre-game win odds (draftpredict on this draft)</div>
    <div class="wp"><i style="width:${g.p_blue * 100}%"></i><i style="width:${(1 - g.p_blue) * 100}%"></i></div>
    <div class="stat"><span>${esc(g.blue)} ${pct(g.p_blue, 0)}</span><span>${esc(g.red)} ${pct(1 - g.p_blue, 0)}</span></div>`}
    <div class="stat" style="margin-top:4px"><span>First pick</span><b>${esc(g.fp === 'B' ? g.blue : g.red)} (${g.fp === 'B' ? 'blue' : 'red'})</b></div>
    ${g.bo ? '' : '<p class="note" style="margin:6px 0 0">Objectives are logged from the next simulation run on.</p>'}`;
  // Draft in order: bans greyed and struck through, picks bordered in side colour; | marks a phase change.
  let prev = null;
  const draft = g.draft.map(x => [x & 2 ? 'b' : 'p', x & 1 ? 'R' : 'B', CH(x >> 2)]).map(([a, s, c]) => { const sep = prev && prev !== a ? '<i>|</i>' : ''; prev = a;
    return `${sep}<span class="${a === 'b' ? 'ban' : 'p'} ${s}" title="${s === 'B' ? 'Blue' : 'Red'} ${a === 'b' ? 'ban' : 'pick'}: ${esc(c)}">${cIcon(c)}</span>` }).join('');
  const maxD = Math.max(...g.bp.map(l => l[4]), ...g.rp.map(l => l[4]), 1);
  const prow = (t, s, champs, lines, r, names) => { const [k, d, a, cs, dmg, gd] = lines[r], sb = names && names[r];  // sb: a non-starter's name
    return `<div class="row ${s}">${cIcon(CH(champs[r]), 'lg')}${sb ? subPhoto(t, r, sb) : pPhoto(t, r)}<div class="who"><b>${esc(sb || player(t, r))}</b><small>${k}/${d}/${a} &middot; ${cs} CS${gd != null ? ' &middot; ' + k1(gd) : ''}</small></div>
      <div class="barcol"><span>${k1(dmg)}</span><i style="width:${dmg / maxD * 100}%"></i></div></div>` };
  const dmg = `<div class="dmg"><div class="head">${esc(g.blue)} &middot; damage to champions</div><div class="head R">${esc(g.red)}</div>
    ${[0, 1, 2, 3, 4].map(r => prow(g.blue, 'B', g.bc, g.bp, r, g.bn) + prow(g.red, 'R', g.rc, g.rp, r, g.rn)).join('')}</div>`;
  return `<div class="game${focus ? ' focus' : ''}" id="game-${g.g}">${bar}
    <div class="drow" aria-label="Draft order">${draft}</div>

}
function openSeries(m, focusGame) {

  }

    <div class="dbody"><p class="note" style="margin:0">${esc(m.round)} &middot; simulation #${RUN().id + 1}. Draft reads left to right; greyed, struck-through icons are bans, coloured borders are blue/red picks.</p>

const pickRows = (a, b, pick, p, gold, slot) => {
  const P = slot && playedSeries(...slot, a, b);
  if (P) return Object.assign([a, b].map(t => ({ team: t, label: (t === P.winner ? CHECK : '') + (t === P.a ? P.wa : P.wb), win: t === P.winner, gold })), { done: true });
  return [{ team: a, label: pick === a ? pct(p, 0) : '', win: pick === a, gold }, { team: b, label: pick === b ? pct(p, 0) : '', win: pick === b, gold }];
};

function playInBracket() {
  let M;
  if (single()) {
    const pi = RUN().play_in;  // order: UB semi x2, UB final, LB semi, LB final, Qualifier
    M = { ubs: seriesRows(pi[0]), ubs2: seriesRows(pi[1]), ubf: seriesRows(pi[2]), lbs: seriesRows(pi[3]), lbf: seriesRows(pi[4]), q: seriesRows(pi[5], true) };
  } else {
    const B = V().pickems.play_in_bracket, P = B.picks, pp = B.pick_prob;
    const semis = Object.keys(P).filter(k => k.startsWith('UB semi'));
    const pair = k => k.replace('UB semi ', '').split('-');
    const [a1, b1] = pair(semis[0]), [a2, b2] = pair(semis[1]);
    const w1 = P[semis[0]], w2 = P[semis[1]], l1 = w1 === a1 ? b1 : a1, l2 = w2 === a2 ? b2 : a2;
    const ubfL = P['UB final'] === w1 ? w2 : w1;
    const at = r => ['play_in', r];
    M = { ubs: pickRows(a1, b1, w1, pp[semis[0]], false, at('UB semi')), ubs2: pickRows(a2, b2, w2, pp[semis[1]], false, at('UB semi')), ubf: pickRows(w1, w2, P['UB final'], pp['UB final'], false, at('UB final')),
          lbs: pickRows(l1, l2, P['LB semi'], pp['LB semi'], false, at('LB semi')), lbf: pickRows(ubfL, P['LB semi'], P['LB final'], pp['LB final'], false, at('LB final')),
          q: pickRows(P['UB final'], P['LB final'], P['Qualifier'], pp['Qualifier'], true, at('Qualifier')) };
  }
  const cell = (area, title, rows) => `<div style="grid-area:${area}">${matchCard(title, rows)}</div>`;
  return `<div class="scroll"><div class="bracket pi-grid">
    ${cell('ubs', 'Upper semifinal', M.ubs)}${cell('ubs2', 'Upper semifinal', M.ubs2)}${cell('ubf', 'Upper final', M.ubf)}
    ${cell('lbs', 'Lower semifinal', M.lbs)}${cell('lbf', 'Lower final', M.lbf)}${cell('q', 'Qualifier \u00b7 10 pts', M.q)}
  </div></div>`;
}

function knockoutBracket() {
  let qf, sf, fin, note = '';
  if (single()) {
    const k = RUN().knockout;
    qf = k.filter(m => m.round === 'QF').map(m => seriesRows(m));
    sf = k.filter(m => m.round === 'SF').map(m => seriesRows(m));
    fin = k.filter(m => m.round === 'Final').map(m => seriesRows(m, true));
  } else {
    const K = R.knockout, B = K.bracket;
    if (!B) {
      qf = K.draw.map(([a, b]) => pickRows(a, b, null, 0)); sf = [pickRows(null, null), pickRows(null, null)]; fin = [pickRows(null, null)];
      note = 'Head-to-head odds not available yet.';
    } else {
      const P = B.picks, pp = B.pick_prob;
      const at = r => ['knockout', r];
      qf = K.draw.map(([a, b], i) => pickRows(a, b, P['QF' + (i + 1)], pp['QF' + (i + 1)], false, at('QF')));
      sf = [pickRows(P.QF1, P.QF2, P.SF1, pp.SF1, false, at('SF')), pickRows(P.QF3, P.QF4, P.SF2, pp.SF2, false, at('SF'))];
      fin = [pickRows(P.SF1, P.SF2, P.Final, pp.Final, true, at('Final'))];
    }
  }
  const col = (head, list, title) => `<div class="bwrap"><div class="bhead">${head}</div><div class="bcol">${list.map(r => matchCard(title, r)).join('')}</div></div>`;
  return `<div class="scroll"><div class="bracket ko-grid">${col('Quarterfinals', qf)}${col('Semifinals', sf)}${col('Final', fin)}</div></div>${note ? `<p class="note">${note}</p>` : ''}`;
}

const RECORDS = ['3-0', '3-1', '3-2', '2-3', '1-3', '0-3'];
function swissBracket() {
  if (single()) {

      return `<div class="bcol"><div class="bhead">Round ${n}</div>${ms.map(m => matchCard(m.round.split(' ')[1] + (m.wa + m.wb > 1 ? ' \u00b7 Bo3' : ''), seriesRows(m))).join('')}</div>`;
    }).join('');

      <h3 style="margin-top:14px">Final records</h3><div class="scroll"><div class="recgrid">${RECORDS.map(r =>
      `<div class="bucket"><h3>${r}</h3>${Object.keys(rec).filter(t => rec[t] === r).map(t => `<div>${teamLab(t)}</div>`).join('')}</div>`).join('')}</div></div>`;

function bracketView() {

// Collapsible panels and cards: the section's heading (an h2, or a Crystal Ball card's number and
// question) becomes the toggle. FOLD[key] keeps the reader's choice across re-renders; def until then.
const FOLD = {};
function fold(key, html, def = true) {
  const m = html.match(/^(\s*<section[^>]*>)(\s*(?:<h2>[\s\S]*?<\/h2>|<div class="qhead">[\s\S]*?<\/p>))([\s\S]*)(<\/section>\s*)$/);
  if (!m) return html;
  return `${m[1]}<details class="fold"${FOLD[key] ?? def ? ' open' : ''} ontoggle="FOLD['${key}'] = this.open"><summary>${m[2]}</summary>${m[3]}</details>${m[4]}`;
}

// Likelihood of the real results so far under the model's pre-game odds (report.likelihood_section).
function oneIn(lp) {
  const x = lp / Math.LN10;  // log10 of the odds against
  if (x < 1) return '1 in ' + (10 ** x).toFixed(1);
  if (x < 6) return '1 in ' + Math.round(10 ** x).toLocaleString();
  const e = Math.floor(x);
  return `1 in ${(10 ** (x - e)).toFixed(1)}&times;10<sup>${e}</sup>`;
}
function likelihoodPanel() {
  const L = R.likelihood, rows = L.series;
  const q = L.pctile;
  const verdict = q < 0.01 ? 'Wildly chaotic' : q < 0.1 ? 'Chaotic' : q < 0.3 ? 'A bit upset-heavy' : q <= 0.7 ? 'About as expected' : q <= 0.9 ? 'A bit chalky' : q <= 0.99 ? 'Chalky' : 'Suspiciously chalky';
  const shown = LIK_ALL ? rows : rows.slice(0, 8);
  const gameRow = g => `<tr class="sub"><td class="name">&nbsp;&nbsp;&nbsp;Game ${g.game} &middot; ${tLogo(g.blue)} ${esc(g.blue)} (blue) vs ${tLogo(g.red)} ${esc(g.red)}</td><td class="name">${teamLab(g.winner)}</td>${bar(g.p_win, 1)}<td>${pct(g.p_win, 1)}</td></tr>`;
  const seriesRow = (x, i) => {
    const open = LIK_OPEN.has(i + ':' + x.round + x.a + x.b), n = x.games.length;
    return `<tr class="srow" data-likser="${esc(i + ':' + x.round + x.a + x.b)}" role="button" tabindex="0" aria-expanded="${open}"><td class="name">${open ? '&#9662;' : '&#9656;'} ${esc(x.round)} &middot; ${tLogo(x.a)} ${esc(x.a)} ${x.wa}&ndash;${x.wb} ${tLogo(x.b)} ${esc(x.b)}</td><td class="name">${teamLab(x.winner)}</td>${bar(x.geo, 1)}<td>${oneIn(-x.logp)}${n > 1 ? ` <span class="note" style="display:inline">(${n} games)</span>` : ''}</td></tr>${open ? x.games.map(gameRow).join('') : ''}`;
  };
  return `<section class="panel wide"><h2>Result likelihood<span class="pill">${L.n} games &middot; ${rows.length} series</span></h2>
  <p class="note">Each finished game priced by the model before it was played (ratings as of that moment, real lineups; bracket-draw luck isn't counted), then multiplied together. Surprise is the share of results the model itself would produce that are at least this unlikely.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px">
    <div class="ans"><span class="big">${oneIn(-L.logp)}</span><span class="answer-p">chance of this exact sequence of winners</span></div>
    <div class="ans"><span class="big">${pct(q, q < 0.01 ? 2 : 1)}</span><span class="answer-p">surprise: ${pct(q, 1)} of results are this unlikely or less &middot; ${verdict}</span></div>
    <div class="ans"><span class="big">${pct(L.geo, 1)}</span><span class="answer-p">average probability the model gave each actual winner (geometric mean), vs ${pct(L.expected_geo, 1)} for a typical result &middot; z ${num(L.z, 2)}</span></div>
    <div class="ans"><span class="big">${L.favorites}/${L.n}</span><span class="answer-p">favorites won vs ${num(L.expected_favorites, 1)} expected</span></div>
  </div>
  <p class="note">Series, most upset-heavy first. The bar is the average probability the model gave the winners of that series' games; the last column is the chance of those exact game results. Click a series for its games.</p>
  <div class="scroll"><table><thead><tr><th>Series</th><th>Winner</th><th>Avg winner chance</th><th>Chance of these games</th></tr></thead><tbody>
  ${shown.map(seriesRow).join('')}
  </tbody></table></div>
  ${rows.length > 8 ? `<button class="expand" data-likexpand>${LIK_ALL ? 'Show the 8 biggest upsets' : `Show all ${rows.length} series`}</button>` : ''}</section>`;
}

  ${knockoutBracket()}
  ${!single() && KB ? `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Match</th><th>Pick</th><th>P(correct)</th><th>Title odds (this draw)</th></tr></thead><tbody>
    ${Object.keys(KB.picks).map(k => `<tr><td class="name">${k}</td><td class="name">${teamLab(KB.picks[k])}</td>${bar(KB.pick_prob[k], 1, k === 'Final' ? 'gold' : '')}<td>${k === 'Final' ? Object.entries(KB.champion_odds).slice(0, 4).map(([t, p]) => `${esc(t)} ${pct(p, 0)}`).join(' &middot; ') : ''}</td></tr>`).join('')}
  </tbody></table></div>` : ''}</section>`);
  const card = (x, i) => single() ? cbSingleCard(x, i) : cbLikelyCard(x, i);
  let score = '';
  if (single()) {
    const hits = Q.filter((x, i) => cbHit(x, RUN().answers[i].answer));
    score = ` In this run the most-likely picks score <b>${hits.reduce((s, x) => s + x.pts, 0)}</b> of ${Q.reduce((s, x) => s + x.pts, 0)} points (${hits.length}/${Q.length}).`;
  }
  return `<div class="grid">${bracket}${fold('swiss_picks', swissPicksPanel())}${fold('swiss_matchups', swissMatchupsPanel())}${fold('swiss_odds', swissOddsPanel())}${ko}</div><h2 style="margin-top:22px">Crystal Ball${tag}</h2>
  <p class="note">${single() ? 'Each card shows what actually happened in this one simulation, how likely that outcome was across all simulations' + (given ? ` ${esc(teamName(given))} wins` : '') + ', and the numbers behind it. Pre-sim odds = that champion, pro or team\'s chance of being the answer, before the event. Game chips open that game.' + score : 'Each card shows the pick with the best chance of being right and how likely it is, the averages behind it, and the distribution it comes from. Ties in the simulated leaderboards are split evenly.'}</p>
  <div class="grid cb">${Q.map((x, i) => fold('cb' + i, card(x, i))).join('')}</div>`;
}

// --- Crystal Ball cards ------------------------------------------------------------------
const cbHit = (x, ans) => ans === x.answer || ans.split(' / ').includes(x.answer);
// P(a single run's answer) under the current view: options, ties ("other") or exact counts.
function cbAnswerP(x, ans) {
  const P = Object.fromEntries(x.options.map(o => [o.label, o.p]));
  const parts = ans.split(' / ');
  if (x.exact && ans in x.exact) {
    const n = +ans, bucket = x.options.find(o => { const [lo, hi] = o.label.split('-').map(Number); return n >= lo && n <= hi });
    return `exactly ${esc(ans)}: <b>${pct(x.exact[ans], 1)}</b>${bucket ? ` &middot; bucket ${esc(bucket.label)}: <b>${pct(bucket.p, 0)}</b>` : ''}`;
  }
  if (x.other && ans in x.other) return `<b>${pct(x.other[ans], 1)}</b> of simulations`;
  if (parts.length > 1) return parts.map(p_ => `${esc(p_)} leads alone or tied: <b>${pct(P[p_] || 0, 1)}</b>`).join(' &middot; ');
  return ans in P ? `<b>${pct(P[ans], 1)}</b> of simulations` : '<b>&lt;0.1%</b> of simulations (never the outcome in the aggregate)';
}

// Crystal Ball card tables: top rows until expanded, sortable by any column. The champion
// questions (Q1-3) add Actual, the rate in the games already played, and sort by it.
const CB_SORT = {}, CB_OPEN = new Set(), CB_TOP = 8;
// Q1-3 read a champion's real totals, Q4-6 a player's (null = none played yet).
const CB_ACTUAL = [
  a => ACT('all').games ? (a.picks + a.bans) / ACT('all').games : null,
  a => a.picks ? a.wins / a.picks : null,
  a => a.picks ? a.deaths / a.picks : null,
  a => a && a.games ? (a.kills + a.assists) / Math.max(a.deaths, 1) : null,
  a => a && a.games ? a.damage / a.games : null,
  a => a && a.team_kills ? (a.kills + a.assists) / a.team_kills : null,
];
const CB_ACTUAL_FMT = [x => pct(x, 0), x => pct(x, 0), x => num(x, 2), x => num(x, 2), x => Math.round(x).toLocaleString(), x => pct(x, 0)];
const actP = (name, sc = 'all') => (ACT(sc).player || {})[name];
const cbNum = s => { const n = parseFloat(String(s).replace(/[,%]/g, '')); return isFinite(n) ? n : null };
// "Picks played", "Picks predicted", "Picks" -> one "Picks" group of Played / Pred. / Total.
function cbHead(cols, i, key) {
  const segs = [];
  for (const c of cols) {
    const m = c.col.match(/^(.*) (played|predicted)$/), g = m ? m[1] : cols.some(d => d.col === c.col + ' played') ? c.col : null;
    const sub = m ? (m[2] === 'played' ? '#' : 'Pred.') : g ? 'Total' : c.col, title = m && m[2] === 'played' ? 'Played so far' : c.title;
    const last = segs[segs.length - 1];
    if (g && last && last.g === g) last.cols.push({ ...c, sub, title }); else segs.push({ g, cols: [{ ...c, sub, title }] });
  }
  const two = segs.some(s => s.g);
  const th = (c, rs) => { const on = c.key === key;
    return `<th${rs ? ' rowspan="2"' : ''}${c.title ? ` title="${esc(c.title)}"` : ''}><button class="sorth${on ? ' on' : ''}" data-cbsort="${i}:${c.key}">${esc(c.sub)}${on ? ' &#9662;' : ''}</button></th>` };
  return `<thead><tr>${segs.map(s => s.g ? `<th class="grp" colspan="${s.cols.length}"><span>${esc(s.g)}</span></th>` : th(s.cols[0], two)).join('')}</tr>
    ${two ? `<tr>${segs.filter(s => s.g).map(s => s.cols.map(c => th(c)).join('')).join('')}</tr>` : ''}</thead>`;
}

function cbLikelyCard(x, i) {
  const max = Math.max(...x.options.map(o => o.p));
  const det = x.detail && x.detail.length ? x.detail : null, dcols = x.detail_cols || [];
  const act = det && hasPlayed() && CB_ACTUAL[i] ? o => CB_ACTUAL[i](i < 3 ? actC(o.label, 'all') : actP(o.label)) : null;
  // Columns: key, header, sort value, cell.
  const cols = [{ key: 'name', col: 'Option', v: o => o.label, cell: o => `<td class="name">${withIcon(o.label)}</td>` }];
  const amax = act ? Math.max(1e-9, ...det.map(o => act(o) ?? 0)) : 1;
  if (act) cols.push({ key: 'act', col: 'Actual', title: `In the ${ACT('all').games} games played so far`, v: act, cell: o => { const a = act(o);
    return a == null ? '<td>&ndash;</td>' : `<td class="cell gold act"><i style="width:${a / amax * 100}%"></i>${CB_ACTUAL_FMT[i](a)}</td>` } });
  cols.push({ key: 'p', col: 'Chance', v: o => o.p, cell: o => bar(o.p, max) });
  if (det) {
    cols.push({ key: 'avg', col: 'Avg', v: o => cbNum(o.value), cell: o => `<td>${esc(o.value)}</td>` });
    dcols.forEach((c, j) => cols.push({ key: 'x' + j, col: c, v: o => cbNum((o.extra || [])[j]), cell: o => `<td>${esc((o.extra || [])[j] ?? '')}</td>` }));
  }
  (cols.find(c => c.key === 'act') || cols.find(c => c.key === 'p')).def = true;
  const key = CB_SORT[i] || cols.find(c => c.def).key, sc = cols.find(c => c.key === key) || cols.find(c => c.def);
  // Ties go through the other columns left to right (Actual, Chance, Avg, ...), then name.
  const list = sortRows([...(det || x.options)], sc, [...cols.slice(1), cols[0]]);
  const n = det ? CB_TOP : 6, open = CB_OPEN.has(i), rows = (open ? list : list.slice(0, n)).map(o => `<tr>${cols.map(c => c.cell(o)).join('')}</tr>`).join('');
  const what = /^Which pro|MVP/.test(x.question) ? 'players' : /^Which champion/.test(x.question) ? 'champions' : /^Which team/.test(x.question) ? 'teams' : 'options';
  return `<section class="panel"><div class="qhead"><span class="qn">Q${i + 1}</span><span class="pill">${x.pts} pts</span></div>
    <p class="q">${esc(x.question)}</p>
    <div class="ans">${i === 8 ? teemoEmote(x.answer) : ''}${labelIcon(x.answer).replace(/class="(ci|tl|pp) /, 'class="$1 lg ')}<span class="big">${esc(x.answer)}</span><span class="ansp">${pct(x.p, 0)}</span></div>
    <div class="scroll cbt${open ? ' open' : ''}"><table>${cbHead(cols, i, sc.key)}<tbody>${rows}</tbody></table></div>
    ${list.length > n ? `<button class="expand" data-cbexpand="${i}">${open ? `Show top ${n}` : `Show all ${list.length} ${what}`}</button>` : ''}
    ${det && dcols.length ? `<p class="note" style="margin:6px 0 0">${act ? 'Actual = the real games so far. ' : ''}Avg = the stat in simulations where the pick qualifies; other columns are averages per simulation. Click a header to sort.</p>` : ''}
    ${(x.viz || []).map(vizBlock).join('')}
    ${x.note ? `<p class="note" style="margin:8px 0 0">${esc(x.note)}</p>` : ''}</section>`;
}

function distBars(d, mark, only = false) {
  const hit = (lo, hi) => mark != null && (only ? mark >= lo && mark < hi : lo >= mark);
  let bars = '', lab = '';
  if (d.pmf) {
    const have = Object.keys(d.pmf).map(Number), lo = Math.min(...have), hi = Math.max(...have), mx = Math.max(...Object.values(d.pmf));
    const ks = hi - lo <= 400 ? Array.from({ length: hi - lo + 1 }, (_, j) => lo + j) : have.sort((a, b) => a - b);
    bars = ks.map(k => `<div class="${hit(k, k + 1) ? 'hit' : ''}" title="${k}: ${pct(d.pmf[k] || 0)}" style="height:${(d.pmf[k] || 0) / mx * 100}%"></div>`).join('');
    lab = `<span>${ks[0]}</span>${mark != null ? `<span>${only ? 'gold = this run' : `gold = ${mark} or more`}</span>` : ''}<span>${ks[ks.length - 1]}</span>`;
  } else if (d.hist) {
    const mx = Math.max(...d.hist.counts), tot = d.hist.counts.reduce((a, b) => a + b, 0), E = d.hist.edges;
    bars = d.hist.counts.map((c, j) => `<div class="${hit(E[j], j === E.length - 2 ? Infinity : E[j + 1]) ? 'hit' : ''}" title="${E[j]}&ndash;${E[j + 1]}: ${pct(c / tot)}" style="height:${c / mx * 100}%"></div>`).join('');
    lab = `<span>${E[0]}</span>${mark != null ? `<span>${only ? 'gold = this run' : `gold &ge; ${mark}`}</span>` : ''}<span>${E[E.length - 1]}</span>`;
  }
  const n = bars.split('<div').length - 1;
  return `<div class="dist"${n > 150 ? ' style="gap:0"' : n > 100 ? ' style="gap:1px"' : ''}>${bars}</div><div class="distlab">${lab}</div>`;
}

function vizBlock(v) {
  if (v.type === 'dist') return `<div class="cbx"><h4>${esc(v.title)}</h4>${distBars(v.dist, v.mark)}
    <div class="stat"><span>median &middot; mean</span><b>${num(v.dist.p50, 1)} &middot; ${num(v.dist.mean, 1)}${v.unit}</b></div><div class="stat"><span>10&ndash;90%</span><b>${num(v.dist.p10, 1)}&ndash;${num(v.dist.p90, 1)}${v.unit}</b></div></div>`;
  if (v.type === 'stats') return `<div class="cbx">${v.rows.map(([k, x]) => `<div class="stat"><span>${esc(k)}</span><b>${esc(x)}</b></div>`).join('')}</div>`;
  if (v.type === 'champ_grid') {  // green = already picked in a real game, first, least expected (R.champ_prior) first
    const got = c => hasPlayed() && actC(c, 'all').picks > 0, n = v.items.filter(([c]) => got(c)).length;
    const pr = (R.champ_prior || {}).p, prior = c => pr && pr[c] != null ? pr[c] : null, pc = p => p >= 0.995 ? '100%' : (p * 100).toFixed(0) + '%';
    const items = [...v.items.filter(([c]) => got(c)).sort(([a], [b]) => (prior(a) ?? 1) - (prior(b) ?? 1)), ...v.items.filter(([c]) => !got(c))];
    return `<div class="cbx"><h4>${esc(v.title)}</h4>${n ? `<div class="stat" style="margin-bottom:4px"><span><span class="cg-key"></span>already picked (${ACT('all').games} games)${pr ? `, % = chance ${esc(R.champ_prior.label.toLowerCase())}, least expected first` : ''}</span><b>${n} champions</b></div>` : ''}<div class="cgrid">${items.map(([c, p]) =>
    `<div class="cg${p < 0.005 ? ' off' : ''}${got(c) ? ' got' : ''}" title="${esc(c)}: ${got(c) ? `picked ${actC(c, 'all').picks}&times; so far${prior(c) != null ? ` (${pct(prior(c))} ${esc(R.champ_prior.label.toLowerCase())})` : ''}` : pct(p)}">${cIcon(c)}<b>${got(c) ? '&#10003;' + (prior(c) != null ? pc(prior(c)) : '') : pc(p)}</b></div>`).join('')}</div></div>`;
  }
  if (v.type === 'region_grid') return `<div class="cbx"><h4>${esc(v.title)}</h4><div class="rgrid">${v.items.map(([rg, p]) =>
    `<div class="rg"><i style="height:${p * 100}%"></i><span>${esc(rg)}</span><b>${pct(p, 0)}</b><div>${Object.keys(R.meta.teams).filter(t => region(t) === rg).map(t => tLogo(t)).join('')}</div></div>`).join('')}</div></div>`;
  if (v.type === 'team_table') return `<div class="cbx"><h4>${esc(v.title)}</h4><div class="scroll"><table><thead><tr><th>Team</th>${v.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${v.rows.map(([t, ...xs]) => `<tr><td class="name">${teamLab(t)}</td>${xs.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return '';
}

// Everything one run's Crystal Ball details need, built from its game logs.
const RUNAGG = {};
// scope: 'all' or one stage. team[t] carries the per-team totals the stat leaders need.
function runAgg(run, scope = 'all') {
  const ck = run.id + '|' + scope;
  if (RUNAGG[ck]) return RUNAGG[ck];
  const games = [], champ = {}, pl = {}, team = {};
  for (const stage of ['play_in', 'swiss', 'knockout']) if (scope === 'all' || scope === stage) for (const m of run[stage]) for (const g of (m.games || [])) {
    const e = { stage, m, g };
    games.push(e);
    for (const [t, side, won, k, d, o] of [[g.blue, 'B', g.blue_win, g.bk, g.rk, g.bo], [g.red, 'R', !g.blue_win, g.rk, g.bk, g.ro]]) {
      const T = team[t] ||= { t, games: 0, wins: 0, k: 0, d: 0, secs: 0, fb: 0, obj: o ? OBJ.map(() => 0) : null };
      T.games++; T.wins += won; T.k += k; T.d += d; T.secs += g.len * 60; T.fb += g.fb === side;
      if (o && T.obj) o.forEach((x, j) => T.obj[j] += x); else T.obj = null;
    }
    for (const x of g.draft) if (x & 2) { const c = CH(x >> 2); (champ[c] ||= { c, picks: 0, wins: 0, k: 0, d: 0, a: 0, bans: 0, games: [] }).bans++ }
    for (const [t, cs, ls, won, tk, ns] of [[g.blue, g.bc, g.bp, g.blue_win, g.bk, g.bn], [g.red, g.rc, g.rp, !g.blue_win, g.rk, g.rn]]) cs.forEach((ci, r) => {
      const c = CH(ci), [k, d, a, cs_, dmg] = ls[r], sb = ns && ns[r], key = t + '|' + r + '|' + (sb || '');
      const C = champ[c] ||= { c, picks: 0, wins: 0, k: 0, d: 0, a: 0, bans: 0, games: [] };
      C.picks++; C.wins += won; C.k += k; C.d += d; C.a += a; C.games.push({ ...e, won, t, r, k, d, a });
      const P = pl[key] ||= { t, r, n: sb, label: `${sb || player(t, r)} (${t})`, games: 0, wins: 0, k: 0, d: 0, a: 0, cs: 0, dmg: 0, tk: 0, list: [] };
      P.games++; P.wins += won; P.k += k; P.d += d; P.a += a; P.cs += cs_; P.dmg += dmg; P.tk += tk; P.list.push({ ...e, won, c, k, d, a, cs: cs_, dmg });
    });
  }
  return RUNAGG[ck] = { games, champ: Object.values(champ), pl: Object.values(pl), team: Object.values(team) };
}
const plByLabel = (A, label) => A.pl.find(p => p.label === label);
function glink(e, text, cls = '') {
  let i = OPEN.indexOf(e.m); if (i < 0) i = OPEN.push(e.m) - 1;
  const st = { play_in: 'PI', swiss: 'SW', knockout: 'KO' }[e.stage];
  return `<button class="glink ${cls}" data-sg="${i}" data-gn="${e.g.g}" title="${esc(teamName(e.g.blue))} vs ${esc(teamName(e.g.red))} &middot; ${esc(e.m.round)} game ${e.g.g}">${text ?? `${st} ${esc(e.m.round.split(' ')[0])} G${e.g.g}`}</button>`;
}
const chipsFor = (list, f) => `<div class="chips">${list.map(e => glink(e, f(e), e.won == null ? '' : e.won ? 'w' : 'l')).join('')}</div>`;
// Same chips, collapsed behind a "N games" toggle so long lists don't swamp the card.
const chipsMore = (list, f, what = 'games') => list.length ? `<details class="more-g"><summary>${list.length} ${what}</summary>${chipsFor(list, f)}</details>` : '';
const vsShort = (e, t) => esc(e.g.blue === t ? e.g.red : e.g.blue);
const cbTable = (head, rows) => `<div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
function teamResult(run, t) {
  if (run.champion === t) return 'Champion';
  const ko = run.knockout.filter(m => m.a === t || m.b === t);
  if (ko.length) return { QF: 'Lost quarterfinal', SF: 'Lost semifinal', Final: 'Lost final' }[ko[ko.length - 1].round] + ` (Swiss ${run.swiss_record[t]})`;
  if (run.swiss_record[t]) return `Swiss ${run.swiss_record[t]}`;
  return 'Out in Play-In';
}
function seriesChips(run, t) {
  const out = [];
  for (const stage of ['play_in', 'swiss', 'knockout']) for (const m of run[stage]) if ((m.a === t || m.b === t) && m.games) {
    const won = m.winner === t, opp = m.a === t ? m.b : m.a, sc = m.a === t ? `${m.wa}-${m.wb}` : `${m.wb}-${m.wa}`;
    out.push(glink({ stage, m, g: m.games[0] }, `${esc(m.round.split(' ')[0])} ${sc} ${esc(opp)}`, won ? 'w' : 'l'));
  }
  return `<div class="chips">${out.join('')}</div>`;
}

function cbSingleDetail(i, run, x) {
  const A = runAgg(run), N = A.games.length;
  // Each entity's chance of topping this question before the event (current view's aggregate).
  const PO = Object.fromEntries([...(x.detail || []).filter(o => o.p > 0), ...x.options].map(o => [o.label, o.p]));
  const odds = label => PO[label] != null ? pct(PO[label], 1) : '&lt;0.1%';
  const OH = 'Pre-sim odds';
  if (!N) return '<p class="note">No game logs for this run.</p>';
  const elig = A.champ.filter(c => c.picks >= 5), pel = A.pl.filter(p => p.games >= 5);
  const top = (arr, f, n = 6) => [...arr].sort((a, b) => f(b) - f(a)).slice(0, n);
  const cRow = (c, cells, chips) => `<tr><td class="name">${withIcon(c.c)}</td>${cells.map(x => `<td>${x}</td>`).join('')}${chips ? `<td style="white-space:normal;min-width:120px">${chips}</td>` : ''}</tr>`;
  const pRow = (p, cells) => `<tr><td class="name"><span class="lab">${p.n ? subPhoto(p.t, p.r, p.n) : pPhoto(p.t, p.r)}<span>${esc(p.n || player(p.t, p.r))}</span><span class="region">${esc(p.t)}</span></span></td>${cells.map(x => `<td>${x}</td>`).join('')}</tr>`;
  const kdaP = p => (p.k + p.a) / Math.max(p.d, 1);
  switch (i) {
    case 0: return cbTable(['Champion', 'Present', 'Picks', 'Bans', OH], top(A.champ, c => c.picks + c.bans, 8).map(c => cRow(c, [`${c.picks + c.bans}/${N} (${pct((c.picks + c.bans) / N, 0)})`, c.picks, c.bans, odds(c.c)])));
    case 1: return cbTable(['Champion', 'W-L', 'WR', OH, 'Games'], top(elig, c => c.wins / c.picks, 5).map(c => cRow(c, [`${c.wins}-${c.picks - c.wins}`, pct(c.wins / c.picks, 0), odds(c.c)], chipsMore(c.games, e => `${esc(e.t)} v ${vsShort(e, e.t)}`))));
    case 2: return cbTable(['Champion', 'Deaths / games', 'Per game', OH, 'Games'], top(elig, c => c.d / c.picks, 5).map(c => cRow(c, [`${c.d} / ${c.picks}`, num(c.d / c.picks, 2), odds(c.c)], chipsMore(c.games, e => `${e.d} d &middot; ${esc(e.t)} v ${vsShort(e, e.t)}`))));
    case 3: return cbTable(['Pro', 'K / D / A', 'Games', 'KDA', OH], top(pel, kdaP).map(p => pRow(p, [`${p.k} / ${p.d} / ${p.a}`, p.games, num(kdaP(p), 2), odds(p.label)])));
    case 4: return cbTable(['Pro', 'Damage', 'Games', 'Per game', OH], top(pel, p => p.dmg / p.games).map(p => pRow(p, [k1(p.dmg), p.games, Math.round(p.dmg / p.games).toLocaleString(), odds(p.label)])));
    case 5: return cbTable(['Pro', 'K + A', 'Team kills', 'KP', OH], top(pel, p => (p.k + p.a) / Math.max(p.tk, 1)).map(p => pRow(p, [p.k + p.a, p.tk, pct((p.k + p.a) / Math.max(p.tk, 1), 0), odds(p.label)])));
    case 6: case 7: {
      const who = i === 6 ? ['Peyz (T1)', 'Gumayusi (HLE)'] : ['Faker (T1)'];
      const box = label => { const p = plByLabel(A, label); if (!p) return `<div>${esc(label)}: no games</div>`;
        return `<div><span class="lab">${pPhoto(p.t, p.r, 'lg')}<span>${esc(player(p.t, p.r))}<br><span class="answer-p"><b>${p.k}</b> kills in ${p.games} games (${num(p.k / p.games, 1)}/g)</span></span></span>
        ${i === 7 ? `<div class="prog${p.k >= 84 ? ' done' : ''}"><i style="width:${Math.min(1, p.k / 84) * 100}%"></i></div><div class="answer-p">${p.k} of 84 needed &middot; career ${616 + p.k}</div>` : ''}
        <h4>K / D / A per game</h4>${chipsMore(p.list, e => `${e.k} / ${e.d} / ${e.a} ${esc(e.c)}`)}</div>` };
      return `<div class="${who.length > 1 ? 'vs2' : ''}">${who.map(box).join('')}</div>`;
    }
    case 8: {
      const c = A.champ.find(c => c.c === 'Teemo');
      return c ? `<div class="answer-p">${c.picks} picks, ${c.bans} bans</div>${c.picks ? chipsFor(c.games, e => `${esc(player(e.t, e.r))} ${e.won ? 'W' : 'L'}`) : ''}` : '<div class="answer-p">Never picked or banned.</div>';
    }
    case 9: {
      const by = Object.fromEntries(A.champ.map(c => [c.c, c]));
      const all = [...(R.champs || [])].sort((a, b) => ((by[b] || {}).picks || 0) - ((by[a] || {}).picks || 0) || a.localeCompare(b));
      return `<h4>Every champion: picked (count) &middot; banned only (struck) &middot; never drafted (grey)</h4><div class="cgrid">${all.map(c => { const x = by[c] || { picks: 0, bans: 0 };
        return `<div class="cg${x.picks ? '' : x.bans ? ' off ban' : ' off'}" title="${esc(c)}: ${x.picks} picks, ${x.bans} bans">${cIcon(c)}${x.picks ? `<b>${x.picks}</b>` : ''}</div>` }).join('')}</div>`;
    }
    case 10: {
      const lens = A.games.map(e => e.g.len), lo = Math.floor(Math.min(...lens) / 2) * 2, hi = Math.ceil(Math.max(...lens) / 2) * 2;
      const bins = []; for (let x = lo; x < hi; x += 2) bins.push(lens.filter(l => l >= x && l < x + 2).length);
      const mx = Math.max(...bins, 1);
      return `<h4>Game lengths (2-minute bins, gold = 32:00 or later)</h4><div class="dist">${bins.map((c, j) => `<div class="${lo + j * 2 >= 32 ? 'hit' : ''}" title="${lo + j * 2}&ndash;${lo + j * 2 + 2} min: ${c} games" style="height:${c / mx * 100}%"></div>`).join('')}</div>
        <div class="distlab"><span>${lo} min</span><span>${hi} min</span></div>
        <div class="stat"><span>shortest &middot; median &middot; longest</span><b>${num(Math.min(...lens), 1)} &middot; ${num([...lens].sort((a, b) => a - b)[lens.length >> 1], 1)} &middot; ${num(Math.max(...lens), 1)} min</b></div>`;
    }
    case 11: case 12: {
      const j = i === 11 ? 'k' : 'cs', perf = A.pl.flatMap(p => p.list.map(e => ({ ...e, p }))).sort((a, b) => b[j] - a[j]).slice(0, 5);
      return `<h4>Best single-game ${i === 11 ? 'kill' : 'CS'} totals</h4>` + cbTable(['Pro', 'Champion', i === 11 ? 'Kills' : 'CS', 'Game'], perf.map(e => `<tr><td class="name"><span class="lab">${pPhoto(e.p.t, e.p.r)}<span>${esc(player(e.p.t, e.p.r))}</span></span></td><td class="name">${withIcon(e.c)}</td><td>${i === 11 ? `${e.k} / ${e.d} / ${e.a}` : e.cs}</td><td>${glink(e, `${esc(e.p.t)} v ${vsShort(e, e.p.t)}`, e.won ? 'w' : 'l')}</td></tr>`));
    }
    case 13: {
      const f = run.knockout.find(m => m.round === 'Final'); if (!f || !f.games) return '';
      const w = f.winner, mvp = run.answers[13].value, rows = [0, 1, 2, 3, 4].map(r => { let k = 0, d = 0, a = 0, dmg = 0;
        for (const g of f.games) { const L = (g.blue === w ? g.bp : g.rp)[r]; k += L[0]; d += L[1]; a += L[2]; dmg += L[4] }
        const isM = `${player(w, r)} (${w})` === mvp;
        return `<tr${isM ? ' style="background:var(--gold-soft)"' : ''}><td class="name"><span class="lab">${pPhoto(w, r)}<span>${esc(player(w, r))}${isM ? ' &#9733;' : ''}</span><span class="region">${ROLE_NAMES[r]}</span></span></td><td>${k} / ${d} / ${a}</td><td>${num((k + a) / Math.max(d, 1), 1)}</td><td>${k1(dmg / f.games.length)}</td><td>${odds(`${player(w, r)} (${w})`)}</td></tr>` });
      return `<h4>${esc(teamName(w))} in the final ${glink({ stage: 'knockout', m: f, g: f.games[0] }, `${f.a} ${f.wa}-${f.wb} ${f.b}`)}</h4>` + cbTable(['Player', 'K / D / A', 'KDA', 'Dmg/g', 'Pre-sim MVP odds'], rows);
    }
    case 14: case 15: {
      const qf = Object.keys(run.swiss_record).filter(t => run.swiss_record[t].startsWith('3-'));
      if (i === 14) { const regs = [...new Set(qf.map(region))].sort();
        return `<div class="rgrid">${regs.map(rg => `<div class="rg"><span>${esc(rg)}</span>${qf.filter(t => region(t) === rg).map(t => `<div class="lab">${tLogo(t)}<span>${esc(t)} ${esc(run.swiss_record[t])}</span></div>`).join('')}</div>`).join('')}</div>`; }
      return cbTable(['LCS team', 'Result'], Object.keys(R.meta.teams).filter(t => region(t) === 'LCS').map(t => `<tr><td class="name">${teamLab(t)}</td><td>${esc(teamResult(run, t))}</td></tr>`));
    }
    case 16: return ['HLE', 'T1'].map(t => `<h4>${teamLab(t)} &middot; ${esc(teamResult(run, t))}</h4>${seriesChips(run, t)}`).join('');
    case 17: {
      const sh = [...A.games].sort((a, b) => a.g.len - b.g.len).slice(0, 5);
      return `<h4>Shortest games</h4>` + cbTable(['Winner', 'Loser', 'Length', OH, 'Game'], sh.map(e => { const w = e.g.blue_win ? e.g.blue : e.g.red, l = e.g.blue_win ? e.g.red : e.g.blue;
        return `<tr><td class="name">${teamLab(w)}</td><td class="name">${esc(l)}</td><td>${mmss(e.g.len)}</td><td>${odds(teamName(w))}</td><td>${glink(e)}</td></tr>` }));
    }
  }
  return '';
}

function cbSingleCard(x, i) {

// Where a team finished in one run, its sort rank, and the pre-sim chance of exactly that finish.
function finishOf(run, t, o) {
  const ko = run.knockout.filter(m => m.a === t || m.b === t), last = ko[ko.length - 1], rec = run.swiss_record[t];
  if (run.champion === t) return { rank: 1, label: 'Champion', p: o.champion };
  if (last) return { QF: { rank: 5, label: 'Quarterfinals', p: o.quarters - o.semis }, SF: { rank: 3, label: 'Semifinals', p: o.semis - o.final },
    Final: { rank: 2, label: 'Finalist', p: o.final - o.champion } }[last.round];
  if (rec) return { rank: { '2-3': 9, '1-3': 12, '0-3': 15 }[rec], label: `Swiss ${rec}`, p: o['swiss_' + rec.replace('-', '_')] };
  return { rank: 20, label: 'Out in Play-In', p: 1 - o.swiss };
}
function oddsRunView() {
  const run = RUN(), O = Object.fromEntries(V().outcomes.map(o => [o.team, o]));
  const rows = Object.keys(O).map(t => ({ t, o: O[t], f: finishOf(run, t, O[t]) })).sort((a, b) => a.f.rank - b.f.rank || b.o.champion - a.o.champion);
  const piRows = run.play_in.length ? playInBracket() : '';

  <p class="note">How every team finished in simulation #${run.id + 1}. Chance of this finish = share of ${given ? `the simulations ${esc(teamName(given))} wins` : 'all simulations'} where the team ends in exactly that place; low numbers are this run's surprises. Chips open each series.</p>
  <div class="scroll"><table><thead><tr><th>Team</th><th>Finish</th><th>Swiss</th><th>Chance of this finish</th><th>Pre-sim title odds</th><th style="text-align:left">Series</th></tr></thead><tbody>
  ${rows.map(({ t, o, f }) => `<tr${f.rank === 1 ? ' style="background:var(--gold-soft)"' : ''}><td class="name"><span class="lab">${tLogo(t)}<span>${esc(teamName(t))}</span><span class="region">${esc(region(t))}</span></span></td><td class="name">${f.label}</td><td>${run.swiss_record[t] ? esc(run.swiss_record[t]) : '&ndash;'}</td>
    ${bar(Math.max(0, f.p), 1, f.p < 0.1 ? 'gold' : '')}<td>${pct(o.champion)}</td><td style="white-space:normal;min-width:180px;text-align:left">${seriesChips(run, t)}</td></tr>`).join('')}
  </tbody></table></div></section>
